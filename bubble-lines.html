<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1f">
  <title>Bubble Lines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1f;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-strong: rgba(255, 255, 255, 0.09);
      --line: rgba(255, 255, 255, 0.09);
      --text: #eef2ff;
      --text-dim: rgba(226, 232, 255, 0.55);
      --accent: #5eead4;
      --accent-2: #818cf8;
      --danger: #fb7185;
      --radius-lg: 28px;
      --radius-md: 16px;
      --board: min(calc(100vw - 32px), 460px, calc(100dvh - 260px));
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html { background: var(--bg); }

    body {
      font-family: 'Outfit', 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* オーロラ風の背景 */
    .aurora {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .aurora::before,
    .aurora::after {
      content: '';
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: drift 18s ease-in-out infinite alternate;
    }

    .aurora::before {
      background: radial-gradient(circle, #2dd4bf 0%, transparent 60%);
      top: -30vmax;
      left: -20vmax;
    }

    .aurora::after {
      background: radial-gradient(circle, #6366f1 0%, transparent 60%);
      bottom: -35vmax;
      right: -25vmax;
      animation-delay: -9s;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(6vmax, 4vmax) scale(1.1); }
    }

    /* 背景の泡 */
    .bubble-bg {
      position: fixed;
      bottom: -30px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), rgba(255,255,255,0.06) 60%);
      animation: rise 12s linear infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 0.6; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }

    /* 上部バー */
    .topbar {
      width: var(--board);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.2s, transform 0.1s;
    }

    .icon-btn:hover { background: var(--surface-strong); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn svg { width: 20px; height: 20px; }

    /* スコアと次の玉 */
    .hud {
      width: var(--board);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .score-value {
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      display: inline-block;
    }

    .score-value.bump {
      animation: bump 0.35s ease;
    }

    @keyframes bump {
      40% { transform: scale(1.18); color: var(--accent); }
    }

    .next-balls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    #nextBalls {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .ball.preview-ball {
      width: 20px;
      height: 20px;
    }

    /* 盤面の埋まり具合 */
    .fill-meter {
      width: var(--board);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .fill-track {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: var(--surface-strong);
      overflow: hidden;
    }

    .fill-bar {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.4s ease, background 0.4s;
    }

    .fill-bar.danger {
      background: linear-gradient(90deg, #f59e0b, var(--danger));
    }

    .fill-meter strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    /* 盤面 */
    .board {
      width: var(--board);
      aspect-ratio: 1;
      padding: calc(var(--board) * 0.022);
      gap: calc(var(--board) * 0.009);
      border-radius: var(--radius-lg);
      background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border: 1px solid var(--line);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
    }

    .cell {
      border-radius: 28%;
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }

    .cell:hover { background: rgba(255, 255, 255, 0.08); }

    .cell.selected {
      background: rgba(94, 234, 212, 0.12);
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    /* ボール */
    .ball {
      position: relative;
      width: 78%;
      height: 78%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--c1) 0%, var(--c2) 45%, var(--c3) 100%);
      box-shadow:
        0 4px 10px -2px var(--glow),
        inset 0 -3px 6px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s;
    }

    /* つやのハイライト */
    .ball::after {
      content: '';
      position: absolute;
      top: 12%;
      left: 20%;
      width: 34%;
      height: 24%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      filter: blur(1px);
      transform: rotate(-30deg);
    }

    .ball.red    { --c1: #ffb3c1; --c2: #ff4d6d; --c3: #b3123b; --glow: rgba(255, 77, 109, 0.55); }
    .ball.blue   { --c1: #b5d4ff; --c2: #3b82f6; --c3: #1e3a8a; --glow: rgba(59, 130, 246, 0.55); }
    .ball.green  { --c1: #b8f7d4; --c2: #22c55e; --c3: #0f6b34; --glow: rgba(34, 197, 94, 0.5); }
    .ball.yellow { --c1: #fff3b0; --c2: #fbbf24; --c3: #b45309; --glow: rgba(251, 191, 36, 0.5); }
    .ball.purple { --c1: #e9c8ff; --c2: #a855f7; --c3: #5b1a99; --glow: rgba(168, 85, 247, 0.55); }

    .cell.selected .ball {
      animation: hop 0.7s ease-in-out infinite;
    }

    @keyframes hop {
      0%, 100% { transform: translateY(0) scale(1.04); }
      50% { transform: translateY(-12%) scale(1.04); }
    }

    /* 移動中のボール */
    .ball.moving {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      transition: left 0.08s linear, top 0.08s linear;
    }

    /* 弾けるエフェクト */
    .ball.removing {
      animation: bubblePop 0.45s cubic-bezier(.3,1.6,.6,1) forwards;
    }

    @keyframes bubblePop {
      0% { transform: scale(1); opacity: 1; }
      35% { transform: scale(1.3); opacity: 1; filter: brightness(1.4); }
      100% { transform: scale(0); opacity: 0; }
    }

    .pop-bubble {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      pointer-events: none;
      z-index: 1001;
      animation: popFloat 0.7s ease-out forwards;
    }

    @keyframes popFloat {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.4) translateY(-30px); opacity: 0; }
    }

    .score-pop {
      position: fixed;
      z-index: 1002;
      pointer-events: none;
      font-weight: 800;
      font-size: 1.4rem;
      color: #fff;
      text-shadow: 0 2px 12px rgba(94, 234, 212, 0.8);
      transform: translate(-50%, -50%);
      animation: scorePop 0.9s ease-out forwards;
    }

    @keyframes scorePop {
      0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -160%) scale(1); }
    }

    /* 軌跡 */
    .ball.trail {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      opacity: 0.5;
      animation: fadeTrail 0.4s ease-out forwards;
    }

    .ball.trail::after { display: none; }

    @keyframes fadeTrail {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(0.2); opacity: 0; }
    }

    /* 下部ボタン */
    .buttons {
      width: var(--board);
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .pill-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.2s, transform 0.1s;
    }

    .pill-btn:hover { background: var(--surface-strong); }
    .pill-btn:active { transform: scale(0.97); }
    .pill-btn svg { width: 18px; height: 18px; }

    .retire-btn { color: var(--danger); }

    .primary-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0a0f1f;
      font-size: 1rem;
      font-weight: 800;
      box-shadow: 0 10px 30px -10px rgba(129, 140, 248, 0.7);
      transition: transform 0.1s, filter 0.2s;
    }

    .primary-btn:hover { filter: brightness(1.08); }
    .primary-btn:active { transform: scale(0.98); }

    /* モーダル共通（スマホでは下から出るシート） */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 20, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 16px;
    }

    .modal-overlay.show {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal,
    .message {
      background: rgba(20, 26, 48, 0.92);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      color: var(--text);
    }

    .modal {
      width: 100%;
      max-width: 380px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px 24px 24px;
      animation: sheetUp 0.35s cubic-bezier(.2,.9,.3,1.1);
    }

    @keyframes sheetUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 480px) {
      .modal-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .modal {
        max-width: none;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }

      .modal::before {
        content: '';
        display: block;
        width: 40px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        margin: -14px auto 18px;
      }
    }

    .modal h2 {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .modal ul {
      list-style: none;
      margin-bottom: 22px;
      display: grid;
      gap: 10px;
    }

    .rules li {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.92rem;
      line-height: 1.6;
      color: rgba(238, 242, 255, 0.85);
    }

    .rules li .num {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: var(--surface-strong);
      display: grid;
      place-items: center;
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent);
      margin-top: 1px;
    }

    /* ランキング */
    .ranking-content {
      max-height: 50vh;
      overflow-y: auto;
      margin-bottom: 18px;
    }

    .ranking-content .loading,
    .ranking-content .empty {
      text-align: center;
      color: var(--text-dim);
      padding: 24px 0;
    }

    .ranking-content .error {
      text-align: center;
      color: var(--danger);
      padding: 24px 0;
    }

    .ranking-list {
      display: grid;
      gap: 6px;
    }

    .ranking-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--surface);
    }

    .ranking-item:nth-child(-n+3) {
      background: var(--surface-strong);
    }

    .ranking-rank {
      width: 28px;
      text-align: center;
      font-weight: 800;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .ranking-rank.gold,
    .ranking-rank.silver,
    .ranking-rank.bronze { font-size: 1.2rem; }

    .ranking-info {
      flex: 1;
      min-width: 0;
    }

    .ranking-name {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 700;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ranking-date {
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .ranking-score {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* ゲームオーバー */
    .message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 32px);
      max-width: 360px;
      padding: 32px 24px 24px;
      text-align: center;
      display: none;
      z-index: 100;
    }

    .message.show {
      display: block;
      animation: popIn 0.4s cubic-bezier(.2,.9,.3,1.2);
      box-shadow: 0 0 0 100vmax rgba(5, 8, 20, 0.65), 0 30px 80px -20px rgba(0, 0, 0, 0.7);
    }

    @keyframes popIn {
      from { transform: translate(-50%, -45%) scale(0.9); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .message h2 {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .final-score {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .score-form {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .score-form input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 16px;
    }

    .score-form input::placeholder { color: var(--text-dim); }

    .score-form input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .submit-btn {
      padding: 0 16px;
      border: none;
      border-radius: 12px;
      background: var(--text);
      color: var(--bg);
      font-weight: 800;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .submit-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .score-note {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .submit-status {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 0.85rem;
      min-height: 1.4em;
      margin-bottom: 14px;
    }

    .submit-status.success { color: var(--accent); }
    .submit-status.error { color: var(--danger); }

    @media (prefers-reduced-motion: reduce) {
      .aurora::before, .aurora::after, .bubble-bg { animation: none; }
      .bubble-bg { display: none; }
    }
  </style>
</head>
<body>
  <div class="aurora"></div>

  <!-- 背景の泡 -->
  <div class="bubble-bg" style="left: 8%; animation-delay: 0s; width: 14px; height: 14px;"></div>
  <div class="bubble-bg" style="left: 22%; animation-delay: 4s; width: 24px; height: 24px;"></div>
  <div class="bubble-bg" style="left: 47%; animation-delay: 7s; width: 10px; height: 10px;"></div>
  <div class="bubble-bg" style="left: 70%; animation-delay: 2s; width: 20px; height: 20px;"></div>
  <div class="bubble-bg" style="left: 88%; animation-delay: 9s; width: 12px; height: 12px;"></div>

  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="戻る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="brand">Bubble Lines</span>
    <div class="topbar-actions">
      <button class="icon-btn" id="helpBtn" aria-label="ルール">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 1c0 1.7-2.5 2.3-2.5 3.8"/><circle cx="12" cy="17.3" r="0.6" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="rankingBtn" aria-label="ランキング">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      </button>
    </div>
  </header>

  <div class="hud">
    <div>
      <div class="label">Score</div>
      <strong class="score-value" id="score">0</strong>
    </div>
    <div class="next-balls">
      <div class="label">Next</div>
      <span id="nextBalls"></span>
    </div>
  </div>

  <div class="fill-meter">
    <div class="fill-track"><div class="fill-bar" id="fillBar"></div></div>
    <span>空き <strong id="empty">78</strong></span>
  </div>

  <div class="board" id="board"></div>

  <div class="buttons">
    <button class="pill-btn retire-btn" id="retireBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
      リタイア
    </button>
    <button class="pill-btn" id="resetBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      リセット
    </button>
  </div>

  <!-- ルール説明モーダル -->
  <div class="modal-overlay" id="rulesModal">
    <div class="modal">
      <h2>あそびかた</h2>
      <ul class="rules">
        <li><span class="num">1</span>泡をタップして選び、空いているマスをタップして移動</li>
        <li><span class="num">2</span>移動できるのは空きマスでつながっている場所だけ</li>
        <li><span class="num">3</span>同じ色を縦・横・斜めに5つ以上並べると消える</li>
        <li><span class="num">4</span>泡を消すとスコアがもらえる</li>
        <li><span class="num">5</span>毎ターン3つの新しい泡が出現する（消したターンは出ない）</li>
        <li><span class="num">6</span>マスが全部埋まるとゲームオーバー</li>
      </ul>
      <button class="primary-btn" id="closeRulesBtn">OK</button>
    </div>
  </div>

  <!-- ランキングモーダル -->
  <div class="modal-overlay" id="rankingModal">
    <div class="modal ranking-modal">
      <h2>ランキング</h2>
      <div id="rankingContent" class="ranking-content">
        <p class="loading">読み込み中...</p>
      </div>
      <button class="primary-btn" id="closeRankingBtn">閉じる</button>
    </div>
  </div>

  <div class="message" id="message">
    <h2>GAME OVER</h2>
    <p class="final-score" id="finalScore">0</p>
    <div id="scoreForm" class="score-form">
      <input type="text" id="playerName" placeholder="名前を入力" maxlength="20">
      <button id="submitScoreBtn" class="submit-btn">登録</button>
    </div>
    <p class="score-note">同じ名前は自己ベストのみ記録されます</p>
    <p id="submitStatus" class="submit-status"></p>
    <button class="primary-btn" id="messageBtn">もういちど</button>
  </div>

  <script>
    // ゲーム設定
    const SIZE = 9;
    const COLORS = ['red', 'blue', 'green', 'yellow', 'purple'];
    const BALLS_PER_TURN = 3;
    const LINE_LENGTH = 5;
    const SAVE_KEY = 'bubbleLinesSave';

    // ゲーム状態
    let board = [];
    let selectedCell = null;
    let score = 0;
    let nextBalls = [];

    // セーブ
    function saveGame() {
      const saveData = {
        board: board,
        score: score,
        nextBalls: nextBalls,
        turnCount: turnCount
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    }

    // ロード
    function loadGame() {
      const saveData = localStorage.getItem(SAVE_KEY);
      if (saveData) {
        try {
          const data = JSON.parse(saveData);
          board = data.board;
          score = data.score;
          nextBalls = data.nextBalls;
          turnCount = data.turnCount || 0;
          updateDisplay();
          renderBoard();
          return true;
        } catch (e) {
          return false;
        }
      }
      return false;
    }

    // セーブデータ削除
    function clearSave() {
      localStorage.removeItem(SAVE_KEY);
    }

    // 効果音
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      if (type === 'move') {
        // 水中を移動する音
        oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'clear') {
        // 泡が弾ける音（ポコポコ）
        for (let i = 0; i < 5; i++) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.setValueAtTime(800 + i * 100, audioCtx.currentTime + i * 0.05);
          osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + i * 0.05 + 0.1);
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.05 + 0.1);
          osc.start(audioCtx.currentTime + i * 0.05);
          osc.stop(audioCtx.currentTime + i * 0.05 + 0.15);
        }
        return;
      } else if (type === 'gameover') {
        // 深海に沈む音
        oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.8);
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.8);
      }
    }

    // 初期化
    function initGame() {
      board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null));
      selectedCell = null;
      score = 0;
      turnCount = 0;
      
      // 次に出るボールを決める
      nextBalls = generateNextBalls();
      
      // 最初のボールを配置
      addBalls();
      nextBalls = generateNextBalls();
      
      clearSave();
      updateDisplay();
      renderBoard();
    }

    // ターン数（波の計算用）
    let turnCount = 0;

    // 意地悪レベルを計算（波のある難易度 + 休憩ゾーン）
    function getMeanLevel() {
      // ベースレベル: スコアに応じてゆるやかに上昇（0〜0.5）
      // 1200点で最大に到達するよう調整
      const baseLevel = Math.min(0.5, score / 1200 * 0.5);
      
      // 波: サイン波で±0.2の変動（周期は約15ターン）
      const turnWave = Math.sin(turnCount * 0.4) * 0.2;
      
      // 休憩ゾーン: 100点ごとに難易度が下がる「谷」を作る
      // スコアの下2桁が0-30の範囲で難易度ダウン
      const scoreInCycle = score % 100;
      let restBonus = 0;
      if (scoreInCycle < 30) {
        // 0〜30点の間は「休憩ゾーン」: 最大-0.25の難易度軽減
        // 15点で最も楽になり、0と30で通常に戻る
        restBonus = -0.25 * Math.sin((scoreInCycle / 30) * Math.PI);
      }
      
      // ランダム要素: ±0.1の揺らぎ
      const randomFactor = (Math.random() - 0.5) * 0.2;
      
      // 合計（0〜0.7の範囲にクランプ）← 天井を下げた
      const level = Math.max(0, Math.min(0.7, baseLevel + turnWave + restBonus + randomFactor));
      
      return level;
    }

    // 次に出るボールを生成（意地悪版）
    function generateNextBalls() {
      const balls = [];
      const meanLevel = getMeanLevel();
      
      for (let i = 0; i < BALLS_PER_TURN; i++) {
        if (Math.random() < meanLevel) {
          // 意地悪モード：盤面で少ない色を選ぶ（揃いにくくなる）
          const colorCounts = {};
          COLORS.forEach(c => colorCounts[c] = 0);
          for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
              if (board[r][c]) colorCounts[board[r][c]]++;
            }
          }
          // 一番少ない色を選ぶ（バラけさせる）
          const sortedColors = COLORS.slice().sort((a, b) => colorCounts[a] - colorCounts[b]);
          // 少ない方から2つの色からランダムに選ぶ
          balls.push(sortedColors[Math.floor(Math.random() * 2)]);
        } else {
          // 通常モード：完全ランダム
          balls.push(COLORS[Math.floor(Math.random() * COLORS.length)]);
        }
      }
      return balls;
    }

    // セルのスコアを計算（意地悪配置用）
    function calculateMeanScore(r, c, color) {
      let score = 0;
      const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];
      
      // この位置に置くと何個揃うか確認（邪魔できるか）
      for (const [dr, dc] of directions) {
        let sameColorCount = 0;
        // 正方向
        let nr = r + dr, nc = c + dc;
        while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === color) {
          sameColorCount++;
          nr += dr;
          nc += dc;
        }
        // 逆方向
        nr = r - dr;
        nc = c - dc;
        while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === color) {
          sameColorCount++;
          nr -= dr;
          nc -= dc;
        }
        
        // 3〜4個揃っている場所には置かない（邪魔になる＝プレイヤーに有利）
        if (sameColorCount >= 3) {
          score -= 100;
        }
      }
      
      // 他の色のラインを邪魔できるかチェック
      for (const otherColor of COLORS) {
        if (otherColor === color) continue;
        for (const [dr, dc] of directions) {
          let lineCount = 0;
          // 正方向
          let nr = r + dr, nc = c + dc;
          while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === otherColor) {
            lineCount++;
            nr += dr;
            nc += dc;
          }
          // 逆方向
          nr = r - dr;
          nc = c - dc;
          while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === otherColor) {
            lineCount++;
            nr -= dr;
            nc -= dc;
          }
          
          // 2〜4個揃っている場所に別の色を置く＝ブロック！
          if (lineCount >= 2 && lineCount < 5) {
            score += lineCount * 10;
          }
        }
      }
      
      // 経路を塞ぐ位置を優先（中央付近）
      const centerDist = Math.abs(r - 4) + Math.abs(c - 4);
      score += (8 - centerDist) * 2;
      
      return score;
    }

    // ボールを追加（意地悪配置版）
    function addBalls() {
      const emptyCells = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === null) {
            emptyCells.push({ r, c });
          }
        }
      }

      const meanLevel = getMeanLevel();
      
      // ボールを配置
      const ballsToAdd = Math.min(nextBalls.length, emptyCells.length);
      const usedCells = new Set();
      
      for (let i = 0; i < ballsToAdd; i++) {
        const color = nextBalls[i];
        let chosenCell;
        
        if (Math.random() < meanLevel && emptyCells.length > 3) {
          // 意地悪モード：スコアが高い位置を選ぶ
          const availableCells = emptyCells.filter(cell => !usedCells.has(`${cell.r},${cell.c}`));
          const scoredCells = availableCells.map(cell => ({
            ...cell,
            score: calculateMeanScore(cell.r, cell.c, color) + Math.random() * 5
          }));
          scoredCells.sort((a, b) => b.score - a.score);
          
          // 上位3つからランダムに選ぶ（少し予測不能に）
          const topN = Math.min(3, scoredCells.length);
          chosenCell = scoredCells[Math.floor(Math.random() * topN)];
        } else {
          // 通常モード：ランダム
          const availableCells = emptyCells.filter(cell => !usedCells.has(`${cell.r},${cell.c}`));
          chosenCell = availableCells[Math.floor(Math.random() * availableCells.length)];
        }
        
        usedCells.add(`${chosenCell.r},${chosenCell.c}`);
        board[chosenCell.r][chosenCell.c] = color;
      }

      // 配置後にラインチェック
      checkAndRemoveLines();
    }

    // 盤面描画
    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;

          if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
            cell.classList.add('selected');
          }

          if (board[r][c]) {
            const ball = document.createElement('div');
            ball.className = `ball ${board[r][c]}`;
            cell.appendChild(ball);
          }

          cell.addEventListener('click', () => handleClick(r, c));
          boardEl.appendChild(cell);
        }
      }

      // 次のボール表示
      const nextBallsEl = document.getElementById('nextBalls');
      nextBallsEl.innerHTML = nextBalls.map(color => 
        `<span class="preview-ball ball ${color}"></span>`
      ).join('');
    }

    // クリック処理
    function handleClick(r, c) {
      // ボールがあるセルをクリック
      if (board[r][c]) {
        selectedCell = { r, c };
        renderBoard();
        return;
      }

      // 空のセルをクリック（移動先）
      if (selectedCell && board[r][c] === null) {
        const path = findPath(selectedCell.r, selectedCell.c, r, c);
        if (path) {
          const color = board[selectedCell.r][selectedCell.c];
          board[selectedCell.r][selectedCell.c] = null;
          const fromR = selectedCell.r;
          const fromC = selectedCell.c;
          selectedCell = null;
          
          // 移動アニメーション実行
          animateMove(fromR, fromC, r, c, color, path);
        }
      }
    }

    // セル上のボールの左上座標と大きさ（盤面は画面幅で伸縮するため実寸から求める）
    function getCellCenter(r, c) {
      const cellEl = document.getElementById('board').children[r * SIZE + c];
      const rect = cellEl.getBoundingClientRect();
      const size = rect.width * 0.78;
      return {
        x: rect.left + (rect.width - size) / 2,
        y: rect.top + (rect.height - size) / 2,
        size
      };
    }

    // 盤面の外を飛ぶボールを作成
    function createFlyingBall(color, size) {
      const ball = document.createElement('div');
      ball.className = `ball ${color} moving`;
      ball.style.width = size + 'px';
      ball.style.height = size + 'px';
      document.body.appendChild(ball);
      return ball;
    }

    // 軌跡を残す（x, y はボールの左上）
    function spawnTrail(color, x, y, ballSize) {
      const size = ballSize * 0.45;
      const trail = document.createElement('div');
      trail.className = `trail ball ${color}`;
      trail.style.width = size + 'px';
      trail.style.height = size + 'px';
      trail.style.left = (x + (ballSize - size) / 2) + 'px';
      trail.style.top = (y + (ballSize - size) / 2) + 'px';
      document.body.appendChild(trail);
      setTimeout(() => trail.remove(), 300);
    }

    // 移動アニメーション
    function animateMove(fromR, fromC, toR, toC, color, path) {
      // 全経路（開始地点含む）
      const fullPath = [{ r: fromR, c: fromC }, ...path];
      let currentStep = 0;

      // 初期位置
      const startPos = getCellCenter(fromR, fromC);
      const ball = createFlyingBall(color, startPos.size);
      ball.style.left = startPos.x + 'px';
      ball.style.top = startPos.y + 'px';
      
      renderBoard();
      
      function moveStep() {
        if (currentStep >= fullPath.length - 1) {
          // アニメーション完了
          ball.remove();
          board[toR][toC] = color;
          playSound('move');
          
          renderBoard();

          // ラインチェック
          const cleared = checkAndRemoveLines();
          
          // ラインが消えなかった場合のみ新しいボールを追加
          if (!cleared) {
            setTimeout(() => {
              addBallsWithAnimation();
            }, 100);
          } else {
            updateDisplay();
            renderBoard();
            saveGame();
            checkGameOver();
          }
          return;
        }
        
        currentStep++;
        const nextCell = fullPath[currentStep];
        const nextPos = getCellCenter(nextCell.r, nextCell.c);
        
        // 軌跡を残す
        const currentPos = getCellCenter(fullPath[currentStep - 1].r, fullPath[currentStep - 1].c);
        spawnTrail(color, currentPos.x, currentPos.y, currentPos.size);
        
        ball.style.left = nextPos.x + 'px';
        ball.style.top = nextPos.y + 'px';
        
        setTimeout(moveStep, 50);
      }
      
      setTimeout(moveStep, 50);
    }

    // ボール追加（アニメーション付き・意地悪配置版）
    function addBallsWithAnimation() {
      const emptyCells = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === null) {
            emptyCells.push({ r, c });
          }
        }
      }

      const meanLevel = getMeanLevel();
      
      // ボールを配置（意地悪配置）
      const ballsToAdd = Math.min(nextBalls.length, emptyCells.length);
      const usedCells = new Set();
      const placementCells = [];
      
      for (let i = 0; i < ballsToAdd; i++) {
        const color = nextBalls[i];
        let chosenCell;
        
        if (Math.random() < meanLevel && emptyCells.length > 3) {
          // 意地悪モード
          const availableCells = emptyCells.filter(cell => !usedCells.has(`${cell.r},${cell.c}`));
          const scoredCells = availableCells.map(cell => ({
            ...cell,
            score: calculateMeanScore(cell.r, cell.c, color) + Math.random() * 5
          }));
          scoredCells.sort((a, b) => b.score - a.score);
          
          const topN = Math.min(3, scoredCells.length);
          chosenCell = scoredCells[Math.floor(Math.random() * topN)];
        } else {
          // 通常モード
          const availableCells = emptyCells.filter(cell => !usedCells.has(`${cell.r},${cell.c}`));
          chosenCell = availableCells[Math.floor(Math.random() * availableCells.length)];
        }
        
        usedCells.add(`${chosenCell.r},${chosenCell.c}`);
        placementCells.push({ ...chosenCell, color });
      }
      
      // 「次に出る玉」の位置を取得
      const nextBallsEl = document.getElementById('nextBalls');
      const previewBalls = nextBallsEl.querySelectorAll('.preview-ball');
      
      let animationsComplete = 0;
      
      for (let i = 0; i < placementCells.length; i++) {
        const cell = placementCells[i];
        const color = cell.color;
        
        // 目標位置
        const target = getCellCenter(cell.r, cell.c);
        const targetX = target.x;
        const targetY = target.y;

        // 落下アニメーション用のボールを作成
        const ball = createFlyingBall(color, target.size);

        // 開始位置（「次に出る玉」のプレビューから）
        let startX, startY;
        if (previewBalls[i]) {
          const previewRect = previewBalls[i].getBoundingClientRect();
          startX = previewRect.left + (previewRect.width - target.size) / 2;
          startY = previewRect.top + (previewRect.height - target.size) / 2;
        } else {
          startX = targetX;
          startY = targetY - 50;
        }
        
        ball.style.left = startX + 'px';
        ball.style.top = startY + 'px';
        
        // 遅延をつけて順番に発射
        setTimeout(() => {
          animateFly(ball, startX, startY, targetX, targetY, color, () => {
            ball.remove();
            board[cell.r][cell.c] = color;
            animationsComplete++;
            
            // 全部のアニメーションが終わったらチェック
            if (animationsComplete >= placementCells.length) {
              turnCount++;
              nextBalls = generateNextBalls();
              setTimeout(() => {
                checkAndRemoveLines();
                updateDisplay();
                renderBoard();
                saveGame();
                checkGameOver();
              }, 100);
            }
          });
        }, i * 200);
      }
      
      // ボールを追加しなかった場合
      if (placementCells.length === 0) {
        nextBalls = generateNextBalls();
        updateDisplay();
        renderBoard();
        checkGameOver();
      }
    }
    
    // 飛んでいくアニメーション
    function animateFly(ball, startX, startY, endX, endY, color, onComplete) {
      const duration = 350;
      const startTime = performance.now();
      const distanceX = endX - startX;
      const distanceY = endY - startY;
      
      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // イージング（ゆっくり始まってゆっくり終わる）
        const easeProgress = progress < 0.5 
          ? 2 * progress * progress 
          : 1 - Math.pow(-2 * progress + 2, 2) / 2;
        
        const currentX = startX + distanceX * easeProgress;
        const currentY = startY + distanceY * easeProgress;
        
        ball.style.left = currentX + 'px';
        ball.style.top = currentY + 'px';
        
        // 軌跡を残す
        if (progress < 1 && Math.random() < 0.4) {
          spawnTrail(color, currentX, currentY, ball.offsetWidth);
        }
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          onComplete();
        }
      }
      
      requestAnimationFrame(animate);
    }

    // 経路探索（BFS）
    function findPath(fromR, fromC, toR, toC) {
      const visited = Array(SIZE).fill(null).map(() => Array(SIZE).fill(false));
      const queue = [{ r: fromR, c: fromC, path: [] }];
      visited[fromR][fromC] = true;

      const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];

      while (queue.length > 0) {
        const current = queue.shift();

        if (current.r === toR && current.c === toC) {
          return current.path;
        }

        for (const [dr, dc] of directions) {
          const nr = current.r + dr;
          const nc = current.c + dc;

          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && 
              !visited[nr][nc] && board[nr][nc] === null) {
            visited[nr][nc] = true;
            queue.push({ 
              r: nr, 
              c: nc, 
              path: [...current.path, { r: nr, c: nc }]
            });
          }
        }
      }

      return null; // 経路なし
    }

    // ラインチェックと削除
    function checkAndRemoveLines() {
      const toRemove = new Set();

      // 全方向チェック
      const directions = [
        [0, 1],   // 横
        [1, 0],   // 縦
        [1, 1],   // 斜め右下
        [1, -1]   // 斜め左下
      ];

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (!board[r][c]) continue;

          const color = board[r][c];

          for (const [dr, dc] of directions) {
            const line = [{ r, c }];

            // 正方向
            let nr = r + dr;
            let nc = c + dc;
            while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === color) {
              line.push({ r: nr, c: nc });
              nr += dr;
              nc += dc;
            }

            // 逆方向
            nr = r - dr;
            nc = c - dc;
            while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === color) {
              line.push({ r: nr, c: nc });
              nr -= dr;
              nc -= dc;
            }

            if (line.length >= LINE_LENGTH) {
              line.forEach(cell => toRemove.add(`${cell.r},${cell.c}`));
            }
          }
        }
      }

      // 削除（アニメーション付き）
      if (toRemove.size > 0) {
        // まずアニメーションを開始
        const boardEl = document.getElementById('board');
        let sumX = 0, sumY = 0;

        toRemove.forEach(key => {
          const [r, c] = key.split(',').map(Number);
          const cellIndex = r * SIZE + c;
          const cell = boardEl.children[cellIndex];
          const ball = cell.querySelector('.ball');
          if (ball) {
            ball.classList.add('removing');
            
            // 小さな泡を複数生成
            const ballRect = ball.getBoundingClientRect();
            const centerX = ballRect.left + ballRect.width / 2;
            const centerY = ballRect.top + ballRect.height / 2;
            sumX += centerX;
            sumY += centerY;

            for (let i = 0; i < 6; i++) {
              setTimeout(() => {
                const bubble = document.createElement('div');
                bubble.className = 'pop-bubble';
                const angle = (i / 6) * Math.PI * 2;
                const distance = 15 + Math.random() * 10;
                bubble.style.left = (centerX + Math.cos(angle) * distance - 4) + 'px';
                bubble.style.top = (centerY + Math.sin(angle) * distance - 4) + 'px';
                document.body.appendChild(bubble);
                setTimeout(() => bubble.remove(), 800);
              }, i * 30);
            }
          }
        });

        // 獲得スコアを消えた泡の中心に表示
        const scorePop = document.createElement('div');
        scorePop.className = 'score-pop';
        scorePop.textContent = `+${toRemove.size * 2}`;
        scorePop.style.left = (sumX / toRemove.size) + 'px';
        scorePop.style.top = (sumY / toRemove.size) + 'px';
        document.body.appendChild(scorePop);
        setTimeout(() => scorePop.remove(), 900);

        // アニメーション後に実際に削除
        setTimeout(() => {
          toRemove.forEach(key => {
            const [r, c] = key.split(',').map(Number);
            board[r][c] = null;
          });
          score += toRemove.size * 2;
          updateDisplay();
          renderBoard();
        }, 400);
        
        playSound('clear');
        return true;
      }

      return false;
    }

    // 表示更新
    function updateDisplay() {
      const scoreEl = document.getElementById('score');
      if (scoreEl.textContent !== String(score)) {
        scoreEl.textContent = score;
        scoreEl.classList.remove('bump');
        void scoreEl.offsetWidth; // アニメーションを再生し直す
        scoreEl.classList.add('bump');
      }

      let empty = 0;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === null) empty++;
        }
      }
      document.getElementById('empty').textContent = empty;

      // 埋まり具合のバー（残り少ないと赤くなる）
      const fillBar = document.getElementById('fillBar');
      fillBar.style.width = ((SIZE * SIZE - empty) / (SIZE * SIZE) * 100) + '%';
      fillBar.classList.toggle('danger', empty <= 15);
    }

    // ゲームオーバーチェック
    function checkGameOver() {
      let empty = 0;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === null) empty++;
        }
      }

      if (empty === 0) {
        document.getElementById('finalScore').textContent = score;
        resetScoreForm();
        document.getElementById('message').classList.add('show');
        clearSave();
        playSound('gameover');
      }
    }

    // イベント設定
    document.getElementById('backBtn').addEventListener('click', () => {
      // セーブしてから戻る
      saveGame();
      window.location.href = 'index.html';
    });
    document.getElementById('resetBtn').addEventListener('click', initGame);
    document.getElementById('retireBtn').addEventListener('click', () => {
      if (score === 0) {
        alert('まだゲームが始まっていません');
        return;
      }
      if (confirm('リタイアしますか？')) {
        forceGameOver();
      }
    });
    document.getElementById('messageBtn').addEventListener('click', () => {
      document.getElementById('message').classList.remove('show');
      initGame();
    });

    // 強制ゲームオーバー（リタイア用）
    function forceGameOver() {
      document.getElementById('finalScore').textContent = score;
      resetScoreForm();
      document.getElementById('message').classList.add('show');
      clearSave();
      playSound('gameover');
    }

    // スコア登録
    // ※ここにGASのWebアプリURLを設定してください
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwU84QkVDt02rRjoeYFhh7MjOstgiC-fsoGVn0CSab6kYWHV7rSMcghOyExSwt3RoGk/exec';

    document.getElementById('submitScoreBtn').addEventListener('click', async () => {
      const nameInput = document.getElementById('playerName');
      const submitBtn = document.getElementById('submitScoreBtn');
      const statusEl = document.getElementById('submitStatus');
      const playerName = nameInput.value.trim();
      
      if (!playerName) {
        statusEl.textContent = '名前を入力してください';
        statusEl.className = 'submit-status error';
        return;
      }
      
      if (GAS_URL === 'YOUR_GAS_WEB_APP_URL') {
        statusEl.textContent = 'GAS URLが設定されていません';
        statusEl.className = 'submit-status error';
        return;
      }
      
      submitBtn.disabled = true;
      statusEl.textContent = '送信中...';
      statusEl.className = 'submit-status';
      
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: `name=${encodeURIComponent(playerName)}&score=${score}`
        });
        
        statusEl.textContent = '登録しました！';
        statusEl.className = 'submit-status success';
        nameInput.disabled = true;
      } catch (error) {
        statusEl.textContent = '登録に失敗しました';
        statusEl.className = 'submit-status error';
        submitBtn.disabled = false;
      }
    });

    // ゲームオーバー時にフォームをリセット
    function resetScoreForm() {
      const nameInput = document.getElementById('playerName');
      const submitBtn = document.getElementById('submitScoreBtn');
      const statusEl = document.getElementById('submitStatus');
      nameInput.value = localStorage.getItem('bubbleLinesPlayerName') || '';
      nameInput.disabled = false;
      submitBtn.disabled = false;
      statusEl.textContent = '';
      statusEl.className = 'submit-status';
    }

    // 名前を保存
    document.getElementById('playerName').addEventListener('change', (e) => {
      localStorage.setItem('bubbleLinesPlayerName', e.target.value);
    });

    // ルールモーダル
    document.getElementById('helpBtn').addEventListener('click', () => {
      document.getElementById('rulesModal').classList.add('show');
    });
    document.getElementById('closeRulesBtn').addEventListener('click', () => {
      document.getElementById('rulesModal').classList.remove('show');
    });
    document.getElementById('rulesModal').addEventListener('click', (e) => {
      if (e.target.id === 'rulesModal') {
        document.getElementById('rulesModal').classList.remove('show');
      }
    });

    // ランキングモーダル
    document.getElementById('rankingBtn').addEventListener('click', () => {
      document.getElementById('rankingModal').classList.add('show');
      loadRanking();
    });
    document.getElementById('closeRankingBtn').addEventListener('click', () => {
      document.getElementById('rankingModal').classList.remove('show');
    });
    document.getElementById('rankingModal').addEventListener('click', (e) => {
      if (e.target.id === 'rankingModal') {
        document.getElementById('rankingModal').classList.remove('show');
      }
    });

    // ランキング読み込み
    async function loadRanking() {
      const contentEl = document.getElementById('rankingContent');
      contentEl.innerHTML = '<p class="loading">読み込み中...</p>';
      
      if (GAS_URL === 'YOUR_GAS_WEB_APP_URL') {
        contentEl.innerHTML = '<p class="error">GAS URLが設定されていません</p>';
        return;
      }
      
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        
        if (!data.success) {
          throw new Error(data.message);
        }
        
        if (data.ranking.length === 0) {
          contentEl.innerHTML = '<p class="empty">まだスコアが登録されていません</p>';
          return;
        }
        
        const listHtml = data.ranking.map((item, index) => {
          const rankClass = index === 0 ? 'gold' : index === 1 ? 'silver' : index === 2 ? 'bronze' : '';
          const rankIcon = index === 0 ? '👑' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}`;
          const dateStr = formatDate(item.date);
          
          return `
            <li class="ranking-item">
              <span class="ranking-rank ${rankClass}">${rankIcon}</span>
              <div class="ranking-info">
                <div class="ranking-name">${escapeHtml(item.name)}</div>
                <div class="ranking-date">${dateStr}</div>
              </div>
              <span class="ranking-score">${item.score}</span>
            </li>
          `;
        }).join('');
        
        contentEl.innerHTML = `<ul class="ranking-list">${listHtml}</ul>`;
        
      } catch (error) {
        contentEl.innerHTML = '<p class="error">読み込みに失敗しました</p>';
      }
    }

    // 日付フォーマット
    function formatDate(dateStr) {
      if (!dateStr) return '';
      
      // 既に yyyy/MM/dd 形式の場合
      if (dateStr.match(/^\d{4}\/\d{2}\/\d{2}/)) {
        return dateStr.split(' ')[0];
      }
      
      // ISO形式（2026-01-12T06:06:33.000Z）の場合
      try {
        const date = new Date(dateStr);
        if (!isNaN(date.getTime())) {
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, '0');
          const d = String(date.getDate()).padStart(2, '0');
          return `${y}/${m}/${d}`;
        }
      } catch (e) {}
      
      // その他の形式はそのまま返す
      return dateStr.split('T')[0] || dateStr;
    }

    // HTMLエスケープ
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ゲーム開始
    if (!loadGame()) {
      initGame();
    }

    // ページを離れる時に自動保存
    window.addEventListener('beforeunload', () => {
      saveGame();
    });
    
    // visibilitychange でも保存（モバイル対応）
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        saveGame();
      }
    });
  </script>
</body>
</html>
