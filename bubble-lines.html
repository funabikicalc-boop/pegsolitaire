<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Lines</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'メイリオ', sans-serif;
      background: linear-gradient(180deg, #006994 0%, #003d5c 40%, #001f3f 100%);
      min-height: 100vh;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* 泡の背景アニメーション */
    .bubble-bg {
      position: fixed;
      bottom: -20px;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.2));
      border-radius: 50%;
      animation: rise 8s infinite;
      opacity: 0.3;
      pointer-events: none;
    }

    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { opacity: 0.5; }
      100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
    }

    h1 {
      color: #7fdbff;
      font-size: 1.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(127, 219, 255, 0.5);
      letter-spacing: 0.1em;
    }

    .info {
      color: #7fdbff;
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    .info span {
      background: rgba(0, 100, 150, 0.5);
      padding: 5px 15px;
      border-radius: 15px;
      border: 1px solid rgba(127, 219, 255, 0.3);
    }

    .next-balls {
      color: #7fdbff;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .next-balls .preview-ball {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-block;
    }

    .board {
      background: linear-gradient(180deg, rgba(0, 80, 120, 0.8), rgba(0, 40, 60, 0.9));
      padding: 8px;
      border-radius: 15px;
      box-shadow: 
        0 10px 40px rgba(0,0,0,0.5),
        inset 0 0 30px rgba(127, 219, 255, 0.1),
        0 0 60px rgba(0, 150, 200, 0.2);
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 2px;
      border: 2px solid rgba(127, 219, 255, 0.2);
    }

    .cell {
      width: 32px;
      height: 32px;
      background: rgba(0, 50, 80, 0.6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    .cell:hover {
      background: rgba(0, 80, 120, 0.8);
    }

    .cell.selected {
      background: rgba(0, 100, 150, 0.9);
      box-shadow: 
        inset 0 2px 4px rgba(0,0,0,0.3),
        0 0 15px rgba(127, 219, 255, 0.4);
    }

    .cell.path-highlight {
      background: rgba(100, 255, 100, 0.3);
    }

    /* 泡スタイルのボール */
    .ball {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      transition: transform 0.15s;
      box-shadow: 
        inset -3px -3px 8px rgba(0,0,0,0.2),
        inset 3px 3px 8px rgba(255,255,255,0.4),
        0 2px 8px rgba(0,0,0,0.3);
    }

    .cell.selected .ball {
      transform: scale(1.1);
      animation: wobble 0.8s infinite;
    }

    @keyframes wobble {
      0%, 100% { transform: scale(1.1) translateY(0); }
      25% { transform: scale(1.1) translateY(-2px) rotate(-2deg); }
      75% { transform: scale(1.1) translateY(-2px) rotate(2deg); }
    }

    /* 泡の色 - カラフルな海中の宝石イメージ */
    .ball.red { 
      background: radial-gradient(circle at 30% 30%, #ff6b6b, #ff0044);
      box-shadow: 
        inset -3px -3px 8px rgba(100,0,0,0.3),
        inset 5px 5px 10px rgba(255,200,200,0.5),
        0 0 15px rgba(255,0,68,0.3);
    }
    .ball.blue { 
      background: radial-gradient(circle at 30% 30%, #74b9ff, #0066ff);
      box-shadow: 
        inset -3px -3px 8px rgba(0,0,100,0.3),
        inset 5px 5px 10px rgba(200,220,255,0.5),
        0 0 15px rgba(0,102,255,0.3);
    }
    .ball.green { 
      background: radial-gradient(circle at 30% 30%, #55efc4, #00cc66);
      box-shadow: 
        inset -3px -3px 8px rgba(0,80,0,0.3),
        inset 5px 5px 10px rgba(200,255,220,0.5),
        0 0 15px rgba(0,204,102,0.3);
    }
    .ball.yellow { 
      background: radial-gradient(circle at 30% 30%, #fff06b, #ffcc00);
      box-shadow: 
        inset -3px -3px 8px rgba(100,80,0,0.3),
        inset 5px 5px 10px rgba(255,255,220,0.5),
        0 0 15px rgba(255,204,0,0.3);
    }
    .ball.purple { 
      background: radial-gradient(circle at 30% 30%, #d589ff, #aa00ff);
      box-shadow: 
        inset -3px -3px 8px rgba(60,0,80,0.3),
        inset 5px 5px 10px rgba(240,200,255,0.5),
        0 0 15px rgba(170,0,255,0.3);
    }

    /* 移動中のボール */
    .ball.moving {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      transition: left 0.08s linear, top 0.08s linear;
    }

    /* 水泡が弾けるエフェクト */
    .ball.removing {
      animation: bubblePop 0.5s ease-out forwards;
    }

    @keyframes bubblePop {
      0% { transform: scale(1); opacity: 1; }
      30% { transform: scale(1.3); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }

    /* 弾ける時の小さな泡 */
    .pop-bubble {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.3));
      pointer-events: none;
      z-index: 1001;
      animation: popFloat 0.8s ease-out forwards;
    }

    @keyframes popFloat {
      0% { transform: scale(1) translateY(0); opacity: 1; }
      100% { transform: scale(0.3) translateY(-40px); opacity: 0; }
    }

    /* 軌跡エフェクト */
    .trail {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      animation: fadeTrail 0.4s ease-out forwards;
      box-shadow: 0 0 10px currentColor;
    }

    @keyframes fadeTrail {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(0.2); opacity: 0; }
    }

    .buttons {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s;
      color: white;
    }

    @media (max-width: 400px) {
      .buttons {
        gap: 8px;
      }
      
      button {
        padding: 8px 12px;
        font-size: 0.8rem;
      }
    }

    button:active {
      transform: scale(0.95);
    }

    .reset-btn {
      background: linear-gradient(135deg, #00a8cc, #006994);
      box-shadow: 0 4px 15px rgba(0, 168, 204, 0.4);
      border: 1px solid rgba(127, 219, 255, 0.3);
    }

    .reset-btn:hover {
      box-shadow: 0 4px 20px rgba(0, 168, 204, 0.6);
    }

    .message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(180deg, rgba(0, 80, 120, 0.95), rgba(0, 40, 60, 0.98));
      color: #7fdbff;
      padding: 30px 40px;
      border-radius: 20px;
      text-align: center;
      display: none;
      z-index: 100;
      border: 2px solid rgba(127, 219, 255, 0.3);
      box-shadow: 0 0 50px rgba(0, 150, 200, 0.3);
      width: 90%;
      max-width: 340px;
    }

    @media (max-width: 400px) {
      .message {
        padding: 20px 15px;
        width: 92%;
      }
      
      .message h2 {
        font-size: 1.4rem;
      }
      
      .message p {
        font-size: 1rem;
      }
    }

    .message.show {
      display: block;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .message h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #ff6b6b;
      text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
    }

    .message p {
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    .message button {
      background: linear-gradient(135deg, #00cc66, #009944);
      box-shadow: 0 4px 15px rgba(0, 204, 102, 0.4);
    }

    .score-form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
      justify-content: center;
    }

    .score-form input {
      padding: 8px 12px;
      border: 2px solid rgba(127, 219, 255, 0.4);
      border-radius: 8px;
      background: rgba(0, 40, 60, 0.8);
      color: #7fdbff;
      font-size: 16px;
      width: 140px;
      max-width: 100%;
    }

    .score-form input::placeholder {
      color: rgba(127, 219, 255, 0.5);
    }

    .score-form input:focus {
      outline: none;
      border-color: rgba(127, 219, 255, 0.8);
    }

    .submit-btn {
      background: linear-gradient(135deg, #ff9500, #ff6b00) !important;
      box-shadow: 0 4px 15px rgba(255, 149, 0, 0.4) !important;
      padding: 8px 15px !important;
      font-size: 0.85rem !important;
      white-space: nowrap;
    }

    .submit-btn:disabled {
      background: linear-gradient(135deg, #666, #444) !important;
      box-shadow: none !important;
      cursor: not-allowed;
    }

    .submit-status {
      font-size: 0.85rem;
      min-height: 1.2em;
      margin-bottom: 10px;
    }

    .score-note {
      font-size: 0.75rem;
      color: rgba(127, 219, 255, 0.6);
      margin-bottom: 8px;
    }

    .submit-status.success {
      color: #55efc4;
    }

    .submit-status.error {
      color: #ff6b6b;
    }

    @media (max-width: 360px) {
      .message {
        padding: 20px 15px;
        width: 95%;
      }
      
      .message h2 {
        font-size: 1.4rem;
      }
      
      .score-form {
        flex-direction: column;
        align-items: center;
      }
      
      .score-form input {
        width: 100%;
      }
      
      .submit-btn {
        width: 100%;
      }
    }

    /* ルールモーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 20, 40, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-overlay.show {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .modal {
      background: linear-gradient(180deg, rgba(0, 80, 120, 0.98), rgba(0, 40, 60, 0.98));
      color: #7fdbff;
      padding: 25px 30px;
      border-radius: 20px;
      max-width: 360px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      border: 2px solid rgba(127, 219, 255, 0.3);
      box-shadow: 0 0 50px rgba(0, 150, 200, 0.3);
      animation: popIn 0.3s ease;
    }

    @media (max-width: 360px) {
      .modal {
        padding: 20px 15px;
        width: 95%;
      }
      
      .modal h2 {
        font-size: 1.2rem;
      }
      
      .modal li {
        font-size: 0.85rem;
      }
    }

    .modal h2 {
      font-size: 1.4rem;
      margin-bottom: 15px;
      text-align: center;
      color: #7fdbff;
      text-shadow: 0 0 10px rgba(127, 219, 255, 0.5);
    }

    .modal ul {
      list-style: none;
      padding: 0;
      margin: 0 0 20px 0;
    }

    .modal li {
      padding: 8px 0;
      border-bottom: 1px solid rgba(127, 219, 255, 0.15);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .modal li:last-child {
      border-bottom: none;
    }

    .modal li::before {
      content: "🫧 ";
    }

    .modal .close-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00a8cc, #006994);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 168, 204, 0.4);
    }

    .help-btn {
      background: linear-gradient(135deg, #0088aa, #006688);
      box-shadow: 0 4px 15px rgba(0, 136, 170, 0.4);
      border: 1px solid rgba(127, 219, 255, 0.3);
    }

    .help-btn:hover {
      box-shadow: 0 4px 20px rgba(0, 136, 170, 0.6);
    }

    .ranking-btn {
      background: linear-gradient(135deg, #ffd700, #ff9500);
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
      border: 1px solid rgba(255, 215, 0, 0.3);
      color: #333;
    }

    .ranking-btn:hover {
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.6);
    }

    .retire-btn {
      background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
      border: 1px solid rgba(255, 107, 107, 0.3);
    }

    .retire-btn:hover {
      box-shadow: 0 4px 20px rgba(255, 107, 107, 0.6);
    }

    .back-btn {
      background: linear-gradient(135deg, #666, #444);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .back-btn:hover {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .ranking-modal {
      max-width: 320px;
    }

    .ranking-content {
      max-height: 50vh;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .ranking-content .loading {
      text-align: center;
      color: rgba(127, 219, 255, 0.7);
    }

    .ranking-content .error {
      text-align: center;
      color: #ff6b6b;
    }

    .ranking-content .empty {
      text-align: center;
      color: rgba(127, 219, 255, 0.7);
    }

    .ranking-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .ranking-item {
      display: flex;
      align-items: center;
      padding: 10px 8px;
      border-bottom: 1px solid rgba(127, 219, 255, 0.15);
      gap: 8px;
    }

    .ranking-item:last-child {
      border-bottom: none;
    }

    .ranking-rank {
      font-weight: bold;
      font-size: 1rem;
      width: 26px;
      text-align: center;
      flex-shrink: 0;
    }

    .ranking-rank.gold { color: #ffd700; }
    .ranking-rank.silver { color: #c0c0c0; }
    .ranking-rank.bronze { color: #cd7f32; }

    .ranking-info {
      flex: 1;
      min-width: 0;
    }

    .ranking-name {
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.9rem;
    }

    .ranking-date {
      font-size: 0.7rem;
      color: rgba(127, 219, 255, 0.6);
    }

    .ranking-score {
      font-weight: bold;
      font-size: 1rem;
      color: #55efc4;
      flex-shrink: 0;
    }

    @media (max-width: 360px) {
      .ranking-modal {
        max-width: 95%;
      }
      
      .ranking-item {
        padding: 8px 5px;
        gap: 6px;
      }
      
      .ranking-rank {
        font-size: 0.9rem;
        width: 24px;
      }
      
      .ranking-name {
        font-size: 0.85rem;
      }
      
      .ranking-score {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <!-- 背景の泡 -->
  <div class="bubble-bg" style="left: 10%; animation-delay: 0s; width: 15px; height: 15px;"></div>
  <div class="bubble-bg" style="left: 20%; animation-delay: 2s; width: 25px; height: 25px;"></div>
  <div class="bubble-bg" style="left: 35%; animation-delay: 4s; width: 18px; height: 18px;"></div>
  <div class="bubble-bg" style="left: 50%; animation-delay: 1s; width: 22px; height: 22px;"></div>
  <div class="bubble-bg" style="left: 65%; animation-delay: 3s; width: 16px; height: 16px;"></div>
  <div class="bubble-bg" style="left: 80%; animation-delay: 5s; width: 20px; height: 20px;"></div>
  <div class="bubble-bg" style="left: 90%; animation-delay: 2.5s; width: 14px; height: 14px;"></div>

  <h1>🫧 Bubble Lines 🫧</h1>
  
  <div class="info">
    <span>スコア: <strong id="score">0</strong></span>
    <span>空きマス: <strong id="empty">78</strong></span>
  </div>

  <div class="next-balls">
    次に出る玉: 
    <span id="nextBalls"></span>
  </div>

  <div class="board" id="board"></div>

  <div class="buttons">
    <button class="back-btn" id="backBtn">← 戻る</button>
    <button class="help-btn" id="helpBtn">ルール</button>
    <button class="ranking-btn" id="rankingBtn">🏆 ランキング</button>
  </div>
  <div class="buttons">
    <button class="retire-btn" id="retireBtn">リタイア</button>
    <button class="reset-btn" id="resetBtn">リセット</button>
  </div>

  <!-- ルール説明モーダル -->
  <div class="modal-overlay" id="rulesModal">
    <div class="modal">
      <h2>🫧 あそびかた 🫧</h2>
      <ul>
        <li>泡をタップして選択し、空いているマスをタップして移動</li>
        <li>移動は空きマスがつながっている場所のみ可能</li>
        <li>同じ色の泡を縦・横・斜めに5つ以上並べると消える</li>
        <li>泡を消すとスコアがもらえる</li>
        <li>毎ターン3つの新しい泡が出現する</li>
        <li>泡を消したターンは新しい泡が出ない</li>
        <li>マスが全部埋まるとゲームオーバー</li>
      </ul>
      <button class="close-btn" id="closeRulesBtn">OK</button>
    </div>
  </div>

  <!-- ランキングモーダル -->
  <div class="modal-overlay" id="rankingModal">
    <div class="modal ranking-modal">
      <h2>🏆 ランキング 🏆</h2>
      <div id="rankingContent" class="ranking-content">
        <p class="loading">読み込み中...</p>
      </div>
      <button class="close-btn" id="closeRankingBtn">閉じる</button>
    </div>
  </div>

  <div class="message" id="message">
    <h2>ゲームオーバー</h2>
    <p>スコア: <span id="finalScore">0</span></p>
    <div id="scoreForm" class="score-form">
      <input type="text" id="playerName" placeholder="名前を入力" maxlength="20">
      <button id="submitScoreBtn" class="submit-btn">スコア登録</button>
    </div>
    <p class="score-note">※同じ名前は自己ベストのみ記録されます</p>
    <p id="submitStatus" class="submit-status"></p>
    <button id="messageBtn">もういちど</button>
  </div>

  <script>
    // ゲーム設定
    const SIZE = 9;
    const COLORS = ['red', 'blue', 'green', 'yellow', 'purple'];
    const BALLS_PER_TURN = 3;
    const LINE_LENGTH = 5;
    const SAVE_KEY = 'bubbleLinesSave';

    // ゲーム状態
    let board = [];
    let selectedCell = null;
    let score = 0;
    let nextBalls = [];

    // セーブ
    function saveGame() {
      const saveData = {
        board: board,
        score: score,
        nextBalls: nextBalls,
        turnCount: turnCount
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    }

    // ロード
    function loadGame() {
      const saveData = localStorage.getItem(SAVE_KEY);
      if (saveData) {
        try {
          const data = JSON.parse(saveData);
          board = data.board;
          score = data.score;
          nextBalls = data.nextBalls;
          turnCount = data.turnCount || 0;
          updateDisplay();
          renderBoard();
          return true;
        } catch (e) {
          return false;
        }
      }
      return false;
    }

    // セーブデータ削除
    function clearSave() {
      localStorage.removeItem(SAVE_KEY);
    }

    // 効果音
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      if (type === 'move') {
        // 水中を移動する音
        oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'clear') {
        // 泡が弾ける音（ポコポコ）
        for (let i = 0; i < 5; i++) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.setValueAtTime(800 + i * 100, audioCtx.currentTime + i * 0.05);
          osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + i * 0.05 + 0.1);
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.05 + 0.1);
          osc.start(audioCtx.currentTime + i * 0.05);
          osc.stop(audioCtx.currentTime + i * 0.05 + 0.15);
        }
        return;
      } else if (type === 'gameover') {
        // 深海に沈む音
        oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.8);
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.8);
      }
    }

    // 初期化
    function initGame() {
      board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null));
      selectedCell = null;
      score = 0;
      turnCount = 0;
      
      // 次に出るボールを決める
      nextBalls = generateNextBalls();
      
      // 最初のボールを配置
      addBalls();
      nextBalls = generateNextBalls();
      
      clearSave();
      updateDisplay();
      renderBoard();
    }

    // ターン数（波の計算用）
    let turnCount = 0;

    // 意地悪レベルを計算（波のある難易度 + 休憩ゾーン）
    function getMeanLevel() {
      // ベースレベル: スコアに応じてゆるやかに上昇（0〜0.5）
      // 1200点で最大に到達するよう調整
      const baseLevel = Math.min(0.5, score / 1200 * 0.5);
      
      // 波: サイン波で±0.2の変動（周期は約15ターン）
      const turnWave = Math.sin(turnCount * 0.4) * 0.2;
      
      // 休憩ゾーン: 100点ごとに難易度が下がる「谷」を作る
      // スコアの下2桁が0-30の範囲で難易度ダウン
      const scoreInCycle = score % 100;
      let restBonus = 0;
      if (scoreInCycle < 30) {
        // 0〜30点の間は「休憩ゾーン」: 最大-0.25の難易度軽減
        // 15点で最も楽になり、0と30で通常に戻る
        restBonus = -0.25 * Math.sin((scoreInCycle / 30) * Math.PI);
      }
      
      // ランダム要素: ±0.1の揺らぎ
      const randomFactor = (Math.random() - 0.5) * 0.2;
      
      // 合計（0〜0.7の範囲にクランプ）← 天井を下げた
      const level = Math.max(0, Math.min(0.7, baseLevel + turnWave + restBonus + randomFactor));
      
      return level;
    }

    // 次に出るボールを生成（意地悪版）
    function generateNextBalls() {
      const balls = [];
      const meanLevel = getMeanLevel();
      
      for (let i = 0; i < BALLS_PER_TURN; i++) {
        if (Math.random() < meanLevel) {
          // 意地悪モード：盤面で少ない色を選ぶ（揃いにくくなる）
          const colorCounts = {};
          COLORS.forEach(c => colorCounts[c] = 0);
          for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
              if (board[r][c]) colorCounts[board[r][c]]++;
            }
          }
          // 一番少ない色を選ぶ（バラけさせる）
          const sortedColors = COLORS.slice().sort((a, b) => colorCounts[a] - colorCounts[b]);
          // 少ない方から2つの色からランダムに選ぶ
          balls.push(sortedColors[Math.floor(Math.random() * 2)]);
        } else {
          // 通常モード：完全ランダム
          balls.push(COLORS[Math.floor(Math.random() * COLORS.length)]);
        }
      }
      return balls;
    }

    // セルのスコアを計算（意地悪配置用）
    function calculateMeanScore(r, c, color) {
      let score = 0;
      const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];
      
      // この位置に置くと何個揃うか確認（邪魔できるか）
      for (const [dr, dc] of directions) {
        let sameColorCount = 0;
        // 正方向
        let nr = r + dr, nc = c + dc;
        while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === color) {
          sameColorCount++;
          nr += dr;
          nc += dc;
        }
        // 逆方向
        nr = r - dr;
        nc = c - dc;
        while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === color) {
          sameColorCount++;
          nr -= dr;
          nc -= dc;
        }
        
        // 3〜4個揃っている場所には置かない（邪魔になる＝プレイヤーに有利）
        if (sameColorCount >= 3) {
          score -= 100;
        }
      }
      
      // 他の色のラインを邪魔できるかチェック
      for (const otherColor of COLORS) {
        if (otherColor === color) continue;
        for (const [dr, dc] of directions) {
          let lineCount = 0;
          // 正方向
          let nr = r + dr, nc = c + dc;
          while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === otherColor) {
            lineCount++;
            nr += dr;
            nc += dc;
          }
          // 逆方向
          nr = r - dr;
          nc = c - dc;
          while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === otherColor) {
            lineCount++;
            nr -= dr;
            nc -= dc;
          }
          
          // 2〜4個揃っている場所に別の色を置く＝ブロック！
          if (lineCount >= 2 && lineCount < 5) {
            score += lineCount * 10;
          }
        }
      }
      
      // 経路を塞ぐ位置を優先（中央付近）
      const centerDist = Math.abs(r - 4) + Math.abs(c - 4);
      score += (8 - centerDist) * 2;
      
      return score;
    }

    // ボールを追加（意地悪配置版）
    function addBalls() {
      const emptyCells = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === null) {
            emptyCells.push({ r, c });
          }
        }
      }

      const meanLevel = getMeanLevel();
      
      // ボールを配置
      const ballsToAdd = Math.min(nextBalls.length, emptyCells.length);
      const usedCells = new Set();
      
      for (let i = 0; i < ballsToAdd; i++) {
        const color = nextBalls[i];
        let chosenCell;
        
        if (Math.random() < meanLevel && emptyCells.length > 3) {
          // 意地悪モード：スコアが高い位置を選ぶ
          const availableCells = emptyCells.filter(cell => !usedCells.has(`${cell.r},${cell.c}`));
          const scoredCells = availableCells.map(cell => ({
            ...cell,
            score: calculateMeanScore(cell.r, cell.c, color) + Math.random() * 5
          }));
          scoredCells.sort((a, b) => b.score - a.score);
          
          // 上位3つからランダムに選ぶ（少し予測不能に）
          const topN = Math.min(3, scoredCells.length);
          chosenCell = scoredCells[Math.floor(Math.random() * topN)];
        } else {
          // 通常モード：ランダム
          const availableCells = emptyCells.filter(cell => !usedCells.has(`${cell.r},${cell.c}`));
          chosenCell = availableCells[Math.floor(Math.random() * availableCells.length)];
        }
        
        usedCells.add(`${chosenCell.r},${chosenCell.c}`);
        board[chosenCell.r][chosenCell.c] = color;
      }

      // 配置後にラインチェック
      checkAndRemoveLines();
    }

    // 盤面描画
    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;

          if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
            cell.classList.add('selected');
          }

          if (board[r][c]) {
            const ball = document.createElement('div');
            ball.className = `ball ${board[r][c]}`;
            cell.appendChild(ball);
          }

          cell.addEventListener('click', () => handleClick(r, c));
          boardEl.appendChild(cell);
        }
      }

      // 次のボール表示
      const nextBallsEl = document.getElementById('nextBalls');
      nextBallsEl.innerHTML = nextBalls.map(color => 
        `<span class="preview-ball ball ${color}"></span>`
      ).join('');
    }

    // クリック処理
    function handleClick(r, c) {
      // ボールがあるセルをクリック
      if (board[r][c]) {
        selectedCell = { r, c };
        renderBoard();
        return;
      }

      // 空のセルをクリック（移動先）
      if (selectedCell && board[r][c] === null) {
        const path = findPath(selectedCell.r, selectedCell.c, r, c);
        if (path) {
          const color = board[selectedCell.r][selectedCell.c];
          board[selectedCell.r][selectedCell.c] = null;
          const fromR = selectedCell.r;
          const fromC = selectedCell.c;
          selectedCell = null;
          
          // 移動アニメーション実行
          animateMove(fromR, fromC, r, c, color, path);
        }
      }
    }

    // 移動アニメーション
    function animateMove(fromR, fromC, toR, toC, color, path) {
      const boardEl = document.getElementById('board');
      const boardRect = boardEl.getBoundingClientRect();
      const cellSize = 34; // cell width + gap
      
      // 移動するボールを作成
      const ball = document.createElement('div');
      ball.className = `ball ${color} moving`;
      document.body.appendChild(ball);
      
      // 全経路（開始地点含む）
      const fullPath = [{ r: fromR, c: fromC }, ...path];
      let currentStep = 0;
      
      function getCellCenter(r, c) {
        return {
          x: boardRect.left + 8 + c * cellSize + cellSize / 2 - 13,
          y: boardRect.top + 8 + r * cellSize + cellSize / 2 - 13
        };
      }
      
      // 初期位置
      const startPos = getCellCenter(fromR, fromC);
      ball.style.left = startPos.x + 'px';
      ball.style.top = startPos.y + 'px';
      
      renderBoard();
      
      function moveStep() {
        if (currentStep >= fullPath.length - 1) {
          // アニメーション完了
          ball.remove();
          board[toR][toC] = color;
          playSound('move');
          
          renderBoard();

          // ラインチェック
          const cleared = checkAndRemoveLines();
          
          // ラインが消えなかった場合のみ新しいボールを追加
          if (!cleared) {
            setTimeout(() => {
              addBallsWithAnimation();
            }, 100);
          } else {
            updateDisplay();
            renderBoard();
            saveGame();
            checkGameOver();
          }
          return;
        }
        
        currentStep++;
        const nextCell = fullPath[currentStep];
        const nextPos = getCellCenter(nextCell.r, nextCell.c);
        
        // 軌跡を残す
        const trail = document.createElement('div');
        trail.className = `trail ball ${color}`;
        const currentPos = getCellCenter(fullPath[currentStep - 1].r, fullPath[currentStep - 1].c);
        trail.style.left = (currentPos.x + 5) + 'px';
        trail.style.top = (currentPos.y + 5) + 'px';
        document.body.appendChild(trail);
        setTimeout(() => trail.remove(), 300);
        
        ball.style.left = nextPos.x + 'px';
        ball.style.top = nextPos.y + 'px';
        
        setTimeout(moveStep, 50);
      }
      
      setTimeout(moveStep, 50);
    }

    // ボール追加（アニメーション付き・意地悪配置版）
    function addBallsWithAnimation() {
      const emptyCells = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === null) {
            emptyCells.push({ r, c });
          }
        }
      }

      const meanLevel = getMeanLevel();
      
      // ボールを配置（意地悪配置）
      const ballsToAdd = Math.min(nextBalls.length, emptyCells.length);
      const usedCells = new Set();
      const placementCells = [];
      
      for (let i = 0; i < ballsToAdd; i++) {
        const color = nextBalls[i];
        let chosenCell;
        
        if (Math.random() < meanLevel && emptyCells.length > 3) {
          // 意地悪モード
          const availableCells = emptyCells.filter(cell => !usedCells.has(`${cell.r},${cell.c}`));
          const scoredCells = availableCells.map(cell => ({
            ...cell,
            score: calculateMeanScore(cell.r, cell.c, color) + Math.random() * 5
          }));
          scoredCells.sort((a, b) => b.score - a.score);
          
          const topN = Math.min(3, scoredCells.length);
          chosenCell = scoredCells[Math.floor(Math.random() * topN)];
        } else {
          // 通常モード
          const availableCells = emptyCells.filter(cell => !usedCells.has(`${cell.r},${cell.c}`));
          chosenCell = availableCells[Math.floor(Math.random() * availableCells.length)];
        }
        
        usedCells.add(`${chosenCell.r},${chosenCell.c}`);
        placementCells.push({ ...chosenCell, color });
      }
      
      const boardEl = document.getElementById('board');
      const boardRect = boardEl.getBoundingClientRect();
      const cellSize = 34;
      
      // 「次に出る玉」の位置を取得
      const nextBallsEl = document.getElementById('nextBalls');
      const previewBalls = nextBallsEl.querySelectorAll('.preview-ball');
      
      let animationsComplete = 0;
      
      for (let i = 0; i < placementCells.length; i++) {
        const cell = placementCells[i];
        const color = cell.color;
        
        // 落下アニメーション用のボールを作成
        const ball = document.createElement('div');
        ball.className = `ball ${color} moving`;
        document.body.appendChild(ball);
        
        // 目標位置
        const targetX = boardRect.left + 8 + cell.c * cellSize + cellSize / 2 - 13;
        const targetY = boardRect.top + 8 + cell.r * cellSize + cellSize / 2 - 13;
        
        // 開始位置（「次に出る玉」のプレビューから）
        let startX, startY;
        if (previewBalls[i]) {
          const previewRect = previewBalls[i].getBoundingClientRect();
          startX = previewRect.left - 3;
          startY = previewRect.top - 3;
        } else {
          startX = targetX;
          startY = boardRect.top - 50;
        }
        
        ball.style.left = startX + 'px';
        ball.style.top = startY + 'px';
        
        // 遅延をつけて順番に発射
        setTimeout(() => {
          animateFly(ball, startX, startY, targetX, targetY, color, () => {
            ball.remove();
            board[cell.r][cell.c] = color;
            animationsComplete++;
            
            // 全部のアニメーションが終わったらチェック
            if (animationsComplete >= placementCells.length) {
              turnCount++;
              nextBalls = generateNextBalls();
              setTimeout(() => {
                checkAndRemoveLines();
                updateDisplay();
                renderBoard();
                saveGame();
                checkGameOver();
              }, 100);
            }
          });
        }, i * 200);
      }
      
      // ボールを追加しなかった場合
      if (placementCells.length === 0) {
        nextBalls = generateNextBalls();
        updateDisplay();
        renderBoard();
        checkGameOver();
      }
    }
    
    // 飛んでいくアニメーション
    function animateFly(ball, startX, startY, endX, endY, color, onComplete) {
      const duration = 350;
      const startTime = performance.now();
      const distanceX = endX - startX;
      const distanceY = endY - startY;
      
      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // イージング（ゆっくり始まってゆっくり終わる）
        const easeProgress = progress < 0.5 
          ? 2 * progress * progress 
          : 1 - Math.pow(-2 * progress + 2, 2) / 2;
        
        const currentX = startX + distanceX * easeProgress;
        const currentY = startY + distanceY * easeProgress;
        
        ball.style.left = currentX + 'px';
        ball.style.top = currentY + 'px';
        
        // 軌跡を残す
        if (progress < 1 && Math.random() < 0.4) {
          const trail = document.createElement('div');
          trail.className = `trail ball ${color}`;
          trail.style.left = (currentX + 5) + 'px';
          trail.style.top = (currentY + 5) + 'px';
          document.body.appendChild(trail);
          setTimeout(() => trail.remove(), 300);
        }
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          onComplete();
        }
      }
      
      requestAnimationFrame(animate);
    }

    // 経路探索（BFS）
    function findPath(fromR, fromC, toR, toC) {
      const visited = Array(SIZE).fill(null).map(() => Array(SIZE).fill(false));
      const queue = [{ r: fromR, c: fromC, path: [] }];
      visited[fromR][fromC] = true;

      const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];

      while (queue.length > 0) {
        const current = queue.shift();

        if (current.r === toR && current.c === toC) {
          return current.path;
        }

        for (const [dr, dc] of directions) {
          const nr = current.r + dr;
          const nc = current.c + dc;

          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && 
              !visited[nr][nc] && board[nr][nc] === null) {
            visited[nr][nc] = true;
            queue.push({ 
              r: nr, 
              c: nc, 
              path: [...current.path, { r: nr, c: nc }]
            });
          }
        }
      }

      return null; // 経路なし
    }

    // ラインチェックと削除
    function checkAndRemoveLines() {
      const toRemove = new Set();

      // 全方向チェック
      const directions = [
        [0, 1],   // 横
        [1, 0],   // 縦
        [1, 1],   // 斜め右下
        [1, -1]   // 斜め左下
      ];

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (!board[r][c]) continue;

          const color = board[r][c];

          for (const [dr, dc] of directions) {
            const line = [{ r, c }];

            // 正方向
            let nr = r + dr;
            let nc = c + dc;
            while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === color) {
              line.push({ r: nr, c: nc });
              nr += dr;
              nc += dc;
            }

            // 逆方向
            nr = r - dr;
            nc = c - dc;
            while (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === color) {
              line.push({ r: nr, c: nc });
              nr -= dr;
              nc -= dc;
            }

            if (line.length >= LINE_LENGTH) {
              line.forEach(cell => toRemove.add(`${cell.r},${cell.c}`));
            }
          }
        }
      }

      // 削除（アニメーション付き）
      if (toRemove.size > 0) {
        // まずアニメーションを開始
        const boardEl = document.getElementById('board');
        const boardRect = boardEl.getBoundingClientRect();
        const cellSize = 34;
        
        toRemove.forEach(key => {
          const [r, c] = key.split(',').map(Number);
          const cellIndex = r * SIZE + c;
          const cell = boardEl.children[cellIndex];
          const ball = cell.querySelector('.ball');
          if (ball) {
            ball.classList.add('removing');
            
            // 小さな泡を複数生成
            const ballRect = ball.getBoundingClientRect();
            const centerX = ballRect.left + ballRect.width / 2;
            const centerY = ballRect.top + ballRect.height / 2;
            
            for (let i = 0; i < 6; i++) {
              setTimeout(() => {
                const bubble = document.createElement('div');
                bubble.className = 'pop-bubble';
                const angle = (i / 6) * Math.PI * 2;
                const distance = 15 + Math.random() * 10;
                bubble.style.left = (centerX + Math.cos(angle) * distance - 4) + 'px';
                bubble.style.top = (centerY + Math.sin(angle) * distance - 4) + 'px';
                document.body.appendChild(bubble);
                setTimeout(() => bubble.remove(), 800);
              }, i * 30);
            }
          }
        });
        
        // アニメーション後に実際に削除
        setTimeout(() => {
          toRemove.forEach(key => {
            const [r, c] = key.split(',').map(Number);
            board[r][c] = null;
          });
          score += toRemove.size * 2;
          updateDisplay();
          renderBoard();
        }, 400);
        
        playSound('clear');
        return true;
      }

      return false;
    }

    // 表示更新
    function updateDisplay() {
      document.getElementById('score').textContent = score;
      
      let empty = 0;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === null) empty++;
        }
      }
      document.getElementById('empty').textContent = empty;
    }

    // ゲームオーバーチェック
    function checkGameOver() {
      let empty = 0;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === null) empty++;
        }
      }

      if (empty === 0) {
        document.getElementById('finalScore').textContent = score;
        resetScoreForm();
        document.getElementById('message').classList.add('show');
        clearSave();
        playSound('gameover');
      }
    }

    // スコア登録
    // ※ここにGASのWebアプリURLを設定してください
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwU84QkVDt02rRjoeYFhh7MjOstgiC-fsoGVn0CSab6kYWHV7rSMcghOyExSwt3RoGk/exec';

    document.getElementById('submitScoreBtn').addEventListener('click', async () => {
      const nameInput = document.getElementById('playerName');
      const submitBtn = document.getElementById('submitScoreBtn');
      const statusEl = document.getElementById('submitStatus');
      const playerName = nameInput.value.trim();
      
      if (!playerName) {
        statusEl.textContent = '名前を入力してください';
        statusEl.className = 'submit-status error';
        return;
      }
      
      if (GAS_URL === 'YOUR_GAS_WEB_APP_URL') {
        statusEl.textContent = 'GAS URLが設定されていません';
        statusEl.className = 'submit-status error';
        return;
      }
      
      submitBtn.disabled = true;
      statusEl.textContent = '送信中...';
      statusEl.className = 'submit-status';
      
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: `name=${encodeURIComponent(playerName)}&score=${score}`
        });
        
        statusEl.textContent = '登録しました！';
        statusEl.className = 'submit-status success';
        nameInput.disabled = true;
      } catch (error) {
        statusEl.textContent = '登録に失敗しました';
        statusEl.className = 'submit-status error';
        submitBtn.disabled = false;
      }
    });

    // ゲームオーバー時にフォームをリセット
    function resetScoreForm() {
      const nameInput = document.getElementById('playerName');
      const submitBtn = document.getElementById('submitScoreBtn');
      const statusEl = document.getElementById('submitStatus');
      nameInput.value = localStorage.getItem('bubbleLinesPlayerName') || '';
      nameInput.disabled = false;
      submitBtn.disabled = false;
      statusEl.textContent = '';
      statusEl.className = 'submit-status';
    }

    // 名前を保存
    document.getElementById('playerName').addEventListener('change', (e) => {
      localStorage.setItem('bubbleLinesPlayerName', e.target.value);
    });

    // ルールモーダル
    document.getElementById('helpBtn').addEventListener('click', () => {
      document.getElementById('rulesModal').classList.add('show');
    });
    document.getElementById('closeRulesBtn').addEventListener('click', () => {
      document.getElementById('rulesModal').classList.remove('show');
    });
    document.getElementById('rulesModal').addEventListener('click', (e) => {
      if (e.target.id === 'rulesModal') {
        document.getElementById('rulesModal').classList.remove('show');
      }
    });

    // ランキングモーダル
    document.getElementById('rankingBtn').addEventListener('click', () => {
      document.getElementById('rankingModal').classList.add('show');
      loadRanking();
    });
    document.getElementById('closeRankingBtn').addEventListener('click', () => {
      document.getElementById('rankingModal').classList.remove('show');
    });
    document.getElementById('rankingModal').addEventListener('click', (e) => {
      if (e.target.id === 'rankingModal') {
        document.getElementById('rankingModal').classList.remove('show');
      }
    });

    // ランキング読み込み
    async function loadRanking() {
      const contentEl = document.getElementById('rankingContent');
      contentEl.innerHTML = '<p class="loading">読み込み中...</p>';
      
      if (GAS_URL === 'YOUR_GAS_WEB_APP_URL') {
        contentEl.innerHTML = '<p class="error">GAS URLが設定されていません</p>';
        return;
      }
      
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        
        if (!data.success) {
          throw new Error(data.message);
        }
        
        if (data.ranking.length === 0) {
          contentEl.innerHTML = '<p class="empty">まだスコアが登録されていません</p>';
          return;
        }
        
        const listHtml = data.ranking.map((item, index) => {
          const rankClass = index === 0 ? 'gold' : index === 1 ? 'silver' : index === 2 ? 'bronze' : '';
          const rankIcon = index === 0 ? '👑' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}`;
          const dateStr = formatDate(item.date);
          
          return `
            <li class="ranking-item">
              <span class="ranking-rank ${rankClass}">${rankIcon}</span>
              <div class="ranking-info">
                <div class="ranking-name">${escapeHtml(item.name)}</div>
                <div class="ranking-date">${dateStr}</div>
              </div>
              <span class="ranking-score">${item.score}</span>
            </li>
          `;
        }).join('');
        
        contentEl.innerHTML = `<ul class="ranking-list">${listHtml}</ul>`;
        
      } catch (error) {
        contentEl.innerHTML = '<p class="error">読み込みに失敗しました</p>';
      }
    }

    // 日付フォーマット
    function formatDate(dateStr) {
      if (!dateStr) return '';
      
      // 既に yyyy/MM/dd 形式の場合
      if (dateStr.match(/^\d{4}\/\d{2}\/\d{2}/)) {
        return dateStr.split(' ')[0];
      }
      
      // ISO形式（2026-01-12T06:06:33.000Z）の場合
      try {
        const date = new Date(dateStr);
        if (!isNaN(date.getTime())) {
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, '0');
          const d = String(date.getDate()).padStart(2, '0');
          return `${y}/${m}/${d}`;
        }
      } catch (e) {}
      
      // その他の形式はそのまま返す
      return dateStr.split('T')[0] || dateStr;
    }

    // HTMLエスケープ
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ゲーム開始
    if (!loadGame()) {
      initGame();
    }

    // ページを離れる時に自動保存
    window.addEventListener('beforeunload', () => {
      saveGame();
    });
    
    // visibilitychange でも保存（モバイル対応）
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        saveGame();
      }
    });
  </script>
</body>
</html>
