    function drawSmoke() {
      smoke.forEach(p => {
        const x = sxOf(p.x);
        if (x < -100 || x > W + 100) return;
        const a = clamp(p.life / p.max, 0, 1);
        ctx.fillStyle = `rgba(${night > 0.5 ? '190,190,200' : '235,235,240'}, ${0.75 * a})`;
        ctx.beginPath();
        ctx.arc(x, trackY + p.y * s, p.r * s, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawPuffs() {
      puffs.forEach(p => {
        const a = clamp(1 - p.t / 1.6, 0, 1);
        const r = (14 + p.t * 40) * clamp(s, 0.7, 1.4);
        ctx.fillStyle = `rgba(200, 210, 90, ${0.55 * a})`;
        [[-0.8, 0.2], [0, -0.4], [0.8, 0.1]].forEach(([dx, dy]) => {
          ctx.beginPath();
          ctx.arc(p.x + dx * r, p.y + dy * r - p.t * 30, r * 0.7, 0, Math.PI * 2);
          ctx.fill();
        });
      });
    }

    function drawPopups() {
      popups.forEach(p => {
        const k = p.t < 0.18 ? 0.6 + p.t / 0.18 * 0.5 : p.t < 0.3 ? 1.1 - (p.t - 0.18) / 0.12 * 0.1 : 1;
        const a = p.t > 1.1 ? clamp(1 - (p.t - 1.1) / 0.4, 0, 1) : 1;
        const size = clamp(30 * s, 20, 44);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(p.x, p.y - p.t * 30);
        ctx.scale(k, k);
        ctx.font = `900 ${size}px "Zen Maru Gothic", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = size * 0.22;
        ctx.strokeStyle = 'rgba(40, 40, 60, 0.85)';
        ctx.strokeText(p.text, 0, 0);
        ctx.fillStyle = p.color;
        ctx.fillText(p.text, 0, 0);
        ctx.restore();
      });
    }

    // 電車が画面の外にいるときは端に矢印を出す（タッチで追いかけカメラ）
    function drawOffscreen() {
      const T = curT();
      const head = W / 2 + wrap(train.p - camX) * s;
      const tail = head - T.len * s;
      let side = 0;
      if (tail > W) side = 1;
      else if (head < 0) side = -1;
      if (!side) return;
      const x = side > 0 ? W - 34 : 34;
      const y = trackY - 60 * s;
      const bob = Math.sin(time * 5) * 4;
      ctx.save();
      ctx.translate(x + side * bob, y);
      circ(0, 0, 26, 'rgba(255, 255, 255, 0.92)');
      ctx.fillStyle = '#ff7a00';
      ctx.beginPath();
      ctx.moveTo(side * 14, 0);
      ctx.lineTo(-side * 8, -13);
      ctx.lineTo(-side * 8, 13);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      hitBoxes.push({ kind: 'arrow', x: x - 36, y: y - 36, w: 72, h: 72 });
    }

    function render() {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      hitBoxes = [];
      const cx = crossSX();
      const roadOn = crossVisible(cx);

      drawSky();
      drawFar();
      drawHouses(false);
      if (roadOn) drawRoad(cx);
      drawWater();
      drawFlowers();
      TREES.forEach(drawTree);
      drawMast(false);
      drawPoles();
      drawStationBack(false);
      if (roadOn) drawCrossingSide(cx, false, false);
      drawTrack(cx, roadOn);
      drawTrain(false);
      drawSmoke();
      drawWire();
      const tinted = sunset > 0.01 || night > 0.01;
      const tint = () => {
        if (sunset > 0.01) {
          ctx.fillStyle = `rgba(255, 130, 50, ${0.16 * sunset})`;
          ctx.fillRect(0, 0, W, H);
        }
        if (night > 0.01) {
          ctx.fillStyle = `rgba(8, 14, 50, ${0.55 * night})`;
          ctx.fillRect(0, 0, W, H);
        }
      };
      const drawFront = () => {
        drawStationFront();
        drawTruss();
        drawTunnel();
        if (roadOn) drawCrossingSide(cx, true, false);
      };
      if (!tinted) {
        drawFront();
      } else {
        // 奥と電車：暗くしてから窓やライトの明かり
        tint();
        if (night > 0.01) {
          ctx.save();
          ctx.globalAlpha = night;
          drawHouses(true);
          drawStationBack(true);
          drawMast(true);
          drawTrain(true);
          if (roadOn) drawCrossingSide(cx, false, true);
          ctx.restore();
        }
        // 手前：別の層に描いて、描いたところだけ暗くしてから重ねる（電車の明かりを隠す）
        const main = ctx;
        ctx = frontCtx;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, frontCanvas.width, frontCanvas.height);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        drawFront();
        ctx.globalCompositeOperation = 'source-atop';
        tint();
        ctx.globalCompositeOperation = 'source-over';
        ctx = main;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(frontCanvas, 0, 0);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        if (night > 0.01 && roadOn) {
          ctx.save();
          ctx.globalAlpha = night;
          drawCrossingSide(cx, true, true);
          ctx.restore();
        }
      }
      drawPuffs();
      drawPopups();
      drawOffscreen();
    }

    // ===== うごき =====
    const drag = { id: null, active: false, x0: 0, y0: 0, lastX: 0, pending: 0 };

    function updateTrain(dt) {
      const T = curT();
      const prevP = train.p;
      const center = trainCenter();
      if (drag.active) {
        train.p += drag.pending;
        drag.pending = 0;
        const meas = (train.p - prevP) / dt;
        train.v = clamp(lerp(train.v, meas, 0.35), -T.maxV, T.maxV);
        braking = false;
      } else {
        if (braking) {
          // とまるボタン：キキーッと止まって、プシュー
          const dec = 650 * dt;
          if (Math.abs(train.v) <= dec) {
            train.v = 0;
            braking = false;
            Snd.pshh(panOf(sxOf(trainCenter())));
          } else {
            train.v -= Math.sign(train.v) * dec;
          }
        } else if (auto) {
          let target = T.cruise * autoDir;
          if (st.state === 'dwell' || st.state === 'manual') target = 0;
          else if (!T.noStop) {
            // 進む向きでいちばん近い駅（出たばかりの駅は除く）
            let d = Infinity, next = -1;
            STATIONS.forEach((sn, i) => {
              if (i === st.skip) return;
              const sc = stopCenter(sn);
              const di = autoDir > 0 ? mod(sc - center, L) : mod(center - sc, L);
              if (di < d) { d = di; next = i; }
            });
            if (d < 2400) {
              const vmax = Math.max(18, Math.sqrt(2 * 300 * Math.max(0, d - 1)));
              if (Math.abs(target) > vmax) target = autoDir * vmax;
              if (d < 3 && Math.abs(train.v) < 40) {
                train.v = 0;
                target = 0;
                st.state = 'dwell';
                st.cur = next;
                st.t = 0;
                st.flags = {};
              }
            }
          }
          // 遮断機が下りきるまでは踏切に入らない（間に合わなければ手前で待つ）
          const ahead = crossAhead();
          if (ahead > 0 && ahead < 3000 && xing.gate > 0.03) {
            const wait = (xing.active ? Math.max(0, 1.0 - xing.onT) : 1.0) + xing.gate / 0.75 + 0.1;
            if (ahead - 60 < Math.abs(train.v) * wait) {
              const vlim = Math.sqrt(2 * 300 * Math.max(0, ahead - 60));
              if (Math.abs(target) > vlim) target = autoDir * vlim;
            }
          }
          const speedingUp = Math.abs(target) > Math.abs(train.v) && Math.sign(target) === Math.sign(train.v || autoDir);
          const rate = speedingUp ? 260 : 420;
          train.v += clamp(target - train.v, -rate * dt, rate * dt);
          // トンネルの手前で警笛
          const toTunnel = autoDir > 0 ? mod(POS.tunnelA - train.p, L) : mod((train.p - T.len) - POS.tunnelB, L);
          if (!tunnelHornDone && toTunnel < 500 && Math.abs(train.v) > 200) {
            tunnelHornDone = true;
            blowHorn();
          }
          if (toTunnel > 1500) tunnelHornDone = false;
        } else {
          // 手をはなしたプラレールのように、すーっと止まる
          const dec = (110 + Math.abs(train.v) * 0.35) * dt;
          train.v = Math.abs(train.v) <= dec ? 0 : train.v - Math.sign(train.v) * dec;
        }
        train.p += train.v * dt;
      }
      const dx = train.p - prevP;
      train.dist += dx;
      if (Math.abs(train.v) > 30) train.dir = Math.sign(train.v);

      // ガタンゴトン：車輪がつなぎ目を通るたび
      if (dx !== 0) {
        const lefts1 = carLefts();
        T.cars.forEach((car, i) => {
          const left0 = lefts1[i] - dx;
          car.axles.forEach(ax => {
            if (Math.floor((left0 + ax) / JOINT) !== Math.floor((lefts1[i] + ax) / JOINT)) {
              const sx = sxOf(lefts1[i] + ax);
              Snd.click(panOf(sx), volOf(sx) * clamp(0.35 + Math.abs(train.v) / 500, 0.35, 1));
            }
          });
        });
      }

      // SL のけむり
      if (T.motor === 'sl') {
        const chimney = carLefts()[0] + 204;
        train.chuffAcc += Math.abs(dx);
        if (train.chuffAcc > 38) {
          train.chuffAcc %= 38;
          const sx = sxOf(chimney);
          Snd.chuff(panOf(sx), volOf(sx));
          smoke.push({ x: chimney, y: -136, r: 10, vy: -50 - Math.abs(train.v) * 0.05, vx: -train.v * 0.3, life: 1.6, max: 1.6 });
        }
        train.idleSmoke -= dt;
        if (Math.abs(train.v) < 20 && train.idleSmoke <= 0) {
          train.idleSmoke = 0.9;
          smoke.push({ x: chimney, y: -136, r: 7, vy: -30, vx: 6, life: 2.2, max: 2.2 });
        }
      }
      if (smoke.length > 70) smoke.splice(0, smoke.length - 70);
      smoke.forEach(p => {
        p.life -= dt;
        p.x += p.vx * dt;
        p.vx *= 0.96;
        p.y += p.vy * dt;
        p.r += 22 * dt;
      });
      for (let i = smoke.length - 1; i >= 0; i--) if (smoke[i].life <= 0) smoke.splice(i, 1);

      // 走行音
      const csx = sxOf(trainCenter());
      Snd.motorUpdate(T.motor, Math.abs(train.v), volOf(csx), panOf(csx));
    }

    function openDoors() {
      if (curT().noStop || train.doorTarget === 1) return;
      train.doorTarget = 1;
      const sx = sxOf(trainCenter());
      Snd.doorChime(panOf(sx));
      popup('ピンポーン', clamp(sx, 80, W - 80), trackY - 150 * s, '#bff3ff');
    }

    function closeDoors() {
      if (train.doorTarget === 0) return;
      train.doorTarget = 0;
      Snd.doorChime(panOf(sxOf(trainCenter())));
    }

    function stopCenter(sn) {
      return sn.headStop !== undefined ? sn.headStop - curT().len / 2 : sn.stop;
    }

    function updateStation(dt) {
      const T = curT();
      const c = trainCenter();
      if (st.skip >= 0 && Math.abs(wrap(c - stopCenter(STATIONS[st.skip]))) > 600) st.skip = -1;
      if (st.state === 'run') {
        const i = STATIONS.findIndex(sn => Math.abs(wrap(c - stopCenter(sn))) < 260);
        if (!T.noStop && !auto && !drag.active && i >= 0 && Math.abs(train.v) < 4) {
          st.still += dt;
          if (st.still > 0.7) {
            st.state = 'manual';
            st.cur = i;
            openDoors();
          }
        } else {
          st.still = 0;
        }
      } else if (st.state === 'manual') {
        if (drag.active) {
          closeDoors();
          st.state = 'run';
        } else if (auto) {
          // 止まっているあいだに「じどう」にしたら、ドアを閉めて出発
          st.state = 'dwell';
          st.t = 4.6;
          st.flags = { opened: true };
        }
      } else if (st.state === 'dwell') {
        st.t += dt;
        if (st.t > 0.5 && !st.flags.opened) { st.flags.opened = true; openDoors(); }
        if (st.t > 5.0 && !st.flags.say) { st.flags.say = true; say('ドアが しまります'); }
        if (st.t > 6.4 && !st.flags.closed) { st.flags.closed = true; closeDoors(); }
        if (drag.active) {
          closeDoors();
          st.state = 'run';
          st.skip = st.cur;
        } else if (!auto) {
          // とまるボタンや ▶ でじどうをやめたら、その駅に止まったまま
          if (!st.flags.opened) openDoors();
          st.state = 'manual';
        } else if (st.t > 7.8) {
          blowHorn(0.6);
          st.state = 'run';
          st.skip = st.cur;
        }
      }
      train.doors += clamp(train.doorTarget - train.doors, -dt * 1.6, dt * 1.6);
      STATIONS.forEach(sn => {
        const off = Math.abs(wrap(c - stopCenter(sn)));
        if (off < 300 && train.doors > 0.95) sn.boardT += dt;
        if (sn.boardT > 1.0) sn.peopleTarget = 0;
        if (off > 1800 && train.doors < 0.05) {
          sn.boardT = 0;
          sn.peopleTarget = 1;
        }
        sn.peopleAlpha += clamp(sn.peopleTarget - sn.peopleAlpha, -dt * 1.5, dt * 1.5);
      });
    }

    // 進む向きで、踏切までの残り（先頭から。後ろ向きなら最後尾から）。通りすぎていればマイナス
    function crossAhead() {
      return autoDir > 0 ? wrap(POS.cross - train.p) : wrap((train.p - curT().len) - POS.cross);
    }

    function crossingWanted() {
      const T = curT();
      const dh = wrap(POS.cross - train.p);      // ＋なら踏切は先頭より前
      const dt_ = dh + T.len;                    // ＋なら踏切は最後尾より前
      if (dh <= 70 && dt_ >= -70) return true;   // 踏切の上にいる
      const v = train.v;
      if (v > 20 && dh > 0 && dh < 450 + v * 2.8) return true;
      if (v < -20 && dt_ < 0 && -dt_ < 450 - v * 2.8) return true;
      if (Math.abs(v) <= 20 && ((dh > 0 && dh < 170) || (dt_ < 0 && dt_ > -170))) return true;
      // じどうで踏切の手前に止まっているとき：これから渡るので鳴らす
      if (auto && st.state === 'run' && !braking) {
        const ahead = crossAhead();
        if (ahead > 0 && ahead < 1200) return true;
      }
      return false;
    }

    function updateCrossing(dt) {
      const byTrain = crossingWanted();
      if (byTrain || time < xing.manualUntil) xing.hold = 0.5;
      else xing.hold -= dt;
      const active = xing.hold > 0;
      if (active && !xing.active) {
        xing.onT = 0;
        xing.bellT = 0;
      }
      xing.active = active;
      if (active) {
        xing.onT += dt;
        xing.bellT -= dt;
        if (xing.bellT <= 0) {
          xing.bellT += 0.37;
          xing.alt ^= 1;
          const cx = crossSX();
          Snd.bell(panOf(cx), volOf(cx), xing.alt);
        }
        if (byTrain) {
          const c = wrap(trainCenter() - POS.cross);
          xing.arrow = Math.abs(train.v) > 20 ? Math.sign(train.v) : (c < 0 ? 1 : -1);
        } else {
          xing.arrow = 0;
        }
      }
      const target = active ? (xing.onT > 1.0 ? 0 : xing.gate) : 1;
      xing.gate += clamp(target - xing.gate, -dt * 0.75, dt * 0.75);
    }

    function pickKind() {
      const total = VKINDS.reduce((a, k) => a + k.weight, 0);
      let r = Math.random() * total;
      for (const k of VKINDS) {
        r -= k.weight;
        if (r < 0) return k;
      }
      return VKINDS[0];
    }

    function updateVehicles(dt) {
      spawnT -= dt;
      if (spawnT <= 0 && vehicles.length < 7) {
        spawnT = 1.6 + Math.random() * 3;
        const lane = Math.random() < 0.5 ? 'away' : 'come';
        const u0 = lane === 'away' ? Math.log(0.5) : Math.log(24);
        const clear = !vehicles.some(v => v.lane === lane && Math.abs(v.u - u0) < V_GAP * 1.6);
        if (clear) {
          vehicles.push({
            lane, u: u0, vu: V_SPEED,
            def: pickKind(),
            color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)],
            speed: V_SPEED * (0.85 + Math.random() * 0.3),
            bump: 0, sirenUntil: 0
          });
        }
      }
      const blocked = xing.active || xing.gate < 0.97;
      const uStopA = Math.log(zT - 0.62);
      const uStopC = Math.log(zT + 0.62);
      ['away', 'come'].forEach(lane => {
        const list = vehicles.filter(v => v.lane === lane);
        // 先頭（進む向きの一番先）から順に
        list.sort((a, b) => lane === 'away' ? b.u - a.u : a.u - b.u);
        list.forEach((v, i) => {
          let room = Infinity;
          if (lane === 'away') {
            if (blocked && v.u <= uStopA + 0.002) room = uStopA - v.u;
            if (i > 0) room = Math.min(room, list[i - 1].u - V_GAP - v.u);
          } else {
            if (blocked && v.u >= uStopC - 0.002) room = v.u - uStopC;
            if (i > 0) room = Math.min(room, v.u - (list[i - 1].u + V_GAP));
          }
          const want = clamp(Math.min(v.speed, room * 3), 0, v.speed);
          v.vu += clamp(want - v.vu, -dt * 1.6, dt * 0.8);
          if (v.vu > room * 3) v.vu = Math.max(0, room * 3);
          v.u += (lane === 'away' ? 1 : -1) * v.vu * dt;
          v.bump = Math.max(0, v.bump - dt * 1.6);
        });
      });
      for (let i = vehicles.length - 1; i >= 0; i--) {
        const v = vehicles[i];
        if ((v.lane === 'away' && v.u > Math.log(26)) || (v.lane === 'come' && v.u < Math.log(0.45))) vehicles.splice(i, 1);
      }
    }

    function updateCamera(dt) {
      const mode = CAM_MODES[camMode];
      let tgt;
      if (mode === 'cross') tgt = POS.cross - 250;
      else if (mode === 'station') tgt = MAIN_STATION.stop;
      else tgt = trainCenter() + train.v * 0.3;
      const diff = wrap(tgt - camX);
      const k = mode === 'train' ? Math.min(1, dt * 4) : Math.min(1, dt * 2.4);
      camU += diff * k;
      camX = mod(camU, L);
    }

    function update(dt) {
      time += dt;
      updateTrain(dt);
      updateStation(dt);
      updateCrossing(dt);
      updateVehicles(dt);
      updateCamera(dt);
      night += clamp((nightOn ? 1 : 0) - night, -dt * 0.6, dt * 0.6);
      if (mast.playing && time > mast.until) mast.playing = false;
      sunset += clamp((mast.playing ? 1 : 0) - sunset, -dt * 0.35, dt * 0.5);
      popups.forEach(p => { p.t += dt; });
      puffs.forEach(p => { p.t += dt; });
      while (puffs.length && puffs[0].t > 1.6) puffs.shift();
      while (popups.length && popups[0].t > 1.5) popups.shift();
    }

    // ===== さわったとき =====
    function blowHorn(vol = 1) {
      const T = curT();
      const sx = clamp(W / 2 + wrap(train.p - camX) * s, 70, W - 70);
      Snd.horn(T.horn, panOf(sx), vol * volOf(sx) + 0.2);
      popup(T.hornText, sx, trackY - 170 * s, '#fff');
    }

    // たまにおなら（つづけては鳴らない）
    function maybeFart(chance) {
      if (time - lastFart < 4 || Math.random() > chance) return false;
      lastFart = time;
      return true;
    }

    function fartAt(x, y) {
      const kind = Snd.fart(panOf(x)).split('-');
      const WORDS = {
        high: { short: ['ぴっ！', 'ぷぴっ！'], long: ['ぴ〜っ', 'ぷぴ〜♪'], huge: ['ぴぃ〜〜〜〜〜っ！', 'ぷぴぴぴ〜〜〜♪'] },
        mid: { short: ['ぷっ！', 'ブッ！'], long: ['ぷぅ〜', 'プ〜〜！'], huge: ['ぷぅ〜〜〜〜〜〜！', 'ブリブリブリ〜〜！'] },
        low: { short: ['ボッ！', 'ドッ！'], long: ['ぶぉぉっ！', 'ブォ〜ン！'], huge: ['ぶぉぉぉぉぉぉ〜〜っ！！', 'ドゥルルルル〜〜！'] }
      };
      const words = (WORDS[kind[0]] || WORDS.mid)[kind[1]] || WORDS.mid.short;
      popup(words[Math.floor(Math.random() * words.length)], x, y - 30 * s, '#ffe08a');
      puffs.push({ x, y, t: 0 });
    }

    function tapAt(x, y) {
      for (let i = hitBoxes.length - 1; i >= 0; i--) {
        const b = hitBoxes[i];
        if (x < b.x || x > b.x + b.w || y < b.y || y > b.y + b.h) continue;
        if (b.kind === 'sun') {
          nightOn = !nightOn;
          Snd.sparkle();
          return;
        }
        if (b.kind === 'mast') {
          // 押すたびに次の曲（鳴っている曲はすっと消える）
          const len = Snd.song(mast.song);
          popup('♪ ' + Snd.songName(mast.song), x, y + 40 * s, '#fff6a0');
          mast.song++;
          mast.playing = true;
          mast.until = time + len;
          return;
        }
        if (b.kind === 'veh') {
          const v = b.ref;
          v.bump = 1;
          if (maybeFart(0.15)) {
            fartAt(x, y);
            return;
          }
          const k = v.def.kind;
          if (k === 'ambulance' || k === 'police' || k === 'fire') v.sirenUntil = time + 3.6;
          Snd.carSound(k, panOf(x));
          const text = { car: 'プップー！', taxi: 'プップー！', bus: 'ブーッ！', ambulance: 'ピーポー', police: 'ウーウー', fire: 'ウーカンカン' }[k];
          popup(text, x, y - 10, '#fff');
          return;
        }
        if (b.kind === 'xing') {
          xing.manualUntil = time + 6;
          return;
        }
        if (b.kind === 'train') {
          if (maybeFart(0.12)) fartAt(x, y);
          else blowHorn();
          return;
        }
        if (b.kind === 'arrow') {
          setCam(1);
          return;
        }
      }
      if (maybeFart(0.3)) fartAt(x, y);
      else Snd.pop();
    }

    // 画面の座標 → ゲームの座標（回しているときは向きを戻す）
    const gp = (e) => rotated ? { x: e.clientY, y: window.innerWidth - e.clientX } : { x: e.clientX, y: e.clientY };

    canvas.addEventListener('pointerdown', (e) => {
      Snd.init();
      const q = gp(e);
      if (drag.id !== null) {
        tapAt(q.x, q.y);
        return;
      }
      drag.id = e.pointerId;
      drag.active = false;
      drag.x0 = drag.lastX = q.x;
      drag.y0 = q.y;
      drag.pending = 0;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    });

    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerId !== drag.id) return;
      const q = gp(e);
      const dx = q.x - drag.lastX;
      drag.lastX = q.x;
      if (!drag.active && Math.hypot(q.x - drag.x0, q.y - drag.y0) > 12) drag.active = true;
      if (drag.active) drag.pending += dx / s;
    });

    function endPointer(e, cancelled) {
      if (e.pointerId !== drag.id) return;
      if (!drag.active && !cancelled) {
        const q = gp(e);
        tapAt(q.x, q.y);
      }
      if (drag.active && Math.abs(train.v) > 40) autoDir = Math.sign(train.v);
      drag.id = null;
      drag.active = false;
      drag.pending = 0;
    }
    canvas.addEventListener('pointerup', (e) => endPointer(e, false));
    canvas.addEventListener('pointercancel', (e) => endPointer(e, true));

    // ===== ボタン =====
    function pressable(el, fn) {
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        Snd.init();
        el.classList.add('pressed');
        fn();
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => el.classList.remove('pressed')));
    }

    pressable(document.getElementById('hornBtn'), () => {
      if (maybeFart(0.1)) fartAt(clamp(W / 2 + wrap(train.p - camX) * s, 70, W - 70), trackY - 120 * s);
      else blowHorn();
    });

    // とまるボタン
    pressable(document.getElementById('stopBtn'), () => {
      auto = false;
      paintAuto();
      const sx = sxOf(trainCenter());
      if (Math.abs(train.v) > 60) {
        braking = true;
        Snd.squeal(Math.abs(train.v) / 650, panOf(sx));
        popup('キキーッ！', clamp(sx, 80, W - 80), trackY - 170 * s, '#fff');
      } else {
        train.v = 0;
        Snd.pshh(panOf(sx));
        popup('プシュー', clamp(sx, 80, W - 80), trackY - 170 * s, '#fff');
      }
    });

    const autoBtn = document.getElementById('autoBtn');
    function paintAuto() {
      autoBtn.classList.toggle('on', auto);
      autoBtn.innerHTML = auto
        ? '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.2" fill="#1f8f45"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2" fill="#1f8f45"/></svg>'
        : '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="#1f8f45"/></svg>';
    }
    pressable(autoBtn, () => {
      auto = !auto;
      if (auto && Math.abs(train.v) > 40) autoDir = Math.sign(train.v);
      paintAuto();
      Snd.pop();
    });
    paintAuto();

    const CAM_ICONS = [
      '<svg viewBox="0 0 24 24"><g transform="rotate(45 12 12)"><rect x="2" y="10" width="20" height="4" fill="#f6c300"/><rect x="6" y="10" width="4" height="4" fill="#222"/><rect x="14" y="10" width="4" height="4" fill="#222"/></g><g transform="rotate(-45 12 12)"><rect x="2" y="10" width="20" height="4" fill="#f6c300"/><rect x="6" y="10" width="4" height="4" fill="#222"/><rect x="14" y="10" width="4" height="4" fill="#222"/></g></svg>',
      '<svg viewBox="0 0 24 24"><path d="M3 8h12c3 0 6 3 6 7v1H3z" fill="#fff"/><path d="M3 8h12c3 0 6 3 6 7v1H3z" fill="none" stroke="#1d4fa8" stroke-width="1.4"/><rect x="3" y="12.5" width="17" height="1.6" fill="#1d4fa8"/><rect x="5" y="9.5" width="2" height="2" fill="#26344d"/><rect x="8.5" y="9.5" width="2" height="2" fill="#26344d"/><circle cx="7" cy="18" r="1.6" fill="#333"/><circle cx="15" cy="18" r="1.6" fill="#333"/></svg>',
      '<svg viewBox="0 0 24 24"><path d="M2 8h20v2H2z" fill="#5d6b79"/><rect x="4" y="10" width="1.6" height="8" fill="#7d8a96"/><rect x="18.4" y="10" width="1.6" height="8" fill="#7d8a96"/><rect x="7" y="11" width="10" height="5" rx="1" fill="#fff" stroke="#2f9a4e" stroke-width="1"/><rect x="2" y="18" width="20" height="3" fill="#b3ada0"/><rect x="2" y="18" width="20" height="1" fill="#f2c200"/></svg>'
    ];
    const camBadge = document.getElementById('camBadge');
    function setCam(m) {
      camMode = m;
      camBadge.innerHTML = CAM_ICONS[camMode];
    }
    pressable(document.getElementById('camBtn'), () => {
      setCam((camMode + 1) % CAM_MODES.length);
      Snd.pop();
    });
    setCam(0);

    // 電車えらび：ボタンに先頭車の絵を描く
    const trainBar = document.getElementById('trainBar');
    const tButtons = {};
    ORDER.forEach(key => {
      const T = TRAINS[key];
      const b = document.createElement('button');
      b.className = 'tbtn';
      b.setAttribute('aria-label', T.name);
      const cv = document.createElement('canvas');
      cv.width = 176;
      cv.height = 124;
      b.appendChild(cv);
      trainBar.appendChild(b);
      tButtons[key] = b;
      const keep = { ctx, CS };
      ctx = cv.getContext('2d');
      CS = { doors: 0, dist: 0, dir: 1 };
      if (T.iconPair) {
        // はやぶさとこまち：鼻と鼻がくっついているところ
        const kk = 0.36;
        ctx.translate(88, 116);
        ctx.scale(kk, kk);
        ctx.fillStyle = '#9aa0a6';
        ctx.fillRect(-260, -4, 520, 4);
        const left = T.cars[2], right = T.cars[1];
        ctx.save();
        ctx.translate(-left.len - GAP / 2, 0);
        CAR_DRAW.shin(left, T, false);
        ctx.restore();
        ctx.save();
        ctx.translate(GAP / 2, 0);
        CAR_DRAW.shin(right, T, false);
        ctx.restore();
      } else {
        const car = T.cars[0];
        const span = Math.min(car.len, 200);
        const kk = Math.min(168 / span, 108 / 145);
        ctx.translate(176 - 6 - car.len * kk, 116);
        ctx.scale(kk, kk);
        ctx.fillStyle = '#9aa0a6';
        ctx.fillRect(-20, -4, car.len + 40, 4);
        CAR_DRAW[car.kind](car, T, false);
      }
      ctx = keep.ctx;
      CS = keep.CS;
      // 列を指でスクロールできるよう、えらぶのは「タップ」だけ
      b.addEventListener('click', () => {
        Snd.init();
        chooseTrain(key);
      });
    });

    function paintTrainButtons() {
      ORDER.forEach(k => tButtons[k].classList.toggle('on', k === train.type));
      const on = tButtons[train.type];
      trainBar.scrollTo({ left: on.offsetLeft - trainBar.clientWidth / 2 + on.clientWidth / 2, behavior: 'smooth' });
    }

    function chooseTrain(key) {
      if (train.type !== key) {
        train.type = key;
        train.doors = 0;
        train.doorTarget = 0;
        st.state = 'run';
        st.skip = -1;
        braking = false;
        train.v = Math.min(Math.abs(train.v), TRAINS[key].maxV) * Math.sign(train.v);
        try { localStorage.setItem('trainTownTrain', key); } catch (e) {}
      }
      paintTrainButtons();
      say(TRAINS[key].name);
    }
    paintTrainButtons();

    // 長押しでゲームセンターへ（小さい子がうっかり押しても抜けない）
    const homeBtn = document.getElementById('homeBtn');
    let holdTimer = null;
    homeBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      homeBtn.classList.add('holding');
      holdTimer = setTimeout(() => { location.href = 'index.html'; }, 900);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => homeBtn.addEventListener(ev, () => {
      clearTimeout(holdTimer);
      homeBtn.classList.remove('holding');
    }));

    // はじめの画面
    const startEl = document.getElementById('start');
    startEl.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      Snd.init();
      startEl.classList.add('hide');
      say('しゅっぱつ しんこう！');
      train.v = curT().cruise * 0.6;
    });

    document.addEventListener('visibilitychange', () => {
      Snd.suspend(document.hidden);
      if (document.hidden && 'speechSynthesis' in window) speechSynthesis.cancel();
    });
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // ===== ループ =====
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
      last = now;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // 確認用（ブラウザのコンソールから状態を見る）
    window.__trainTown = { train, xing, st, vehicles, setCam, chooseTrain, setNight: (v) => { nightOn = v; night = v ? 1 : 0; }, setAuto: (v) => { auto = v; paintAuto(); }, step: (sec) => { for (let i = 0; i < sec * 60; i++) update(1 / 60); } };
  })();
  </script>
</body>
</html>
